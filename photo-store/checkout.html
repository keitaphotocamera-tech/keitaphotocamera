<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ชำระเงิน</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js"></script>
  <script src="js/liff-helper.js"></script>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-white transition">

  <main class="max-w-4xl mx-auto p-4 pb-40">

    <header class="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition">
      <div class="flex justify-between gap-3">
        <div>
          <p id="txtMiniApp" class="text-xs text-slate-500 dark:text-slate-400">LINE Mini App</p>
          <h1 id="txtPageTitle" class="text-xl font-bold">ชำระเงิน</h1>
          <p id="txtPageDesc" class="text-sm text-slate-500 dark:text-slate-400">ตรวจสอบรายการและแนบสลิป</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-2">
          <button onclick="goCart()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2 font-bold">
            ← <span id="txtBack">กลับ</span>
          </button>

          <select id="langSelect" onchange="changeLanguage(this.value)" class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-3 py-2 text-sm font-bold outline-none">
            <option value="th">🇹🇭 TH</option>
            <option value="en">🇺🇸 EN</option>
            <option value="ru">🇷🇺 RU</option>
          </select>

          <button onclick="toggleDarkMode()" id="darkBtn" class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-4 py-2 text-sm font-bold">
            🌙 Dark
          </button>
        </div>
      </div>

      <div id="profileBox" class="hidden mt-4 bg-slate-50 dark:bg-slate-800 rounded-2xl p-3 transition">
        <div class="flex items-center gap-3">
          <img id="linePicture" class="w-11 h-11 rounded-full object-cover bg-slate-200 dark:bg-slate-700" />

          <div>
            <p id="lineName" class="font-bold">-</p>
            <p id="txtConnected" class="text-xs text-emerald-600">เชื่อมต่อ LINE แล้ว</p>
          </div>
        </div>
      </div>
    </header>

    <section class="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-3xl p-4 mb-4">
      <p id="txtPromoTitle" class="font-bold text-emerald-700 dark:text-emerald-300">
        🎉 โปรเหมา
      </p>
      <p id="txtPromoDesc" class="text-sm text-emerald-700 dark:text-emerald-300 mt-1">
        ซื้อครบ 10 รูป เหลือ 250 บาท • 20 รูป เหลือ 500 บาท
      </p>
      <p id="promoSavingText" class="hidden text-sm font-bold text-emerald-700 dark:text-emerald-300 mt-2">
        ประหยัด 0 บาท
      </p>
    </section>

    <section id="cartList" class="space-y-3"></section>

    <section class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm mt-4 transition">
      <h2 id="txtPromptpayTitle" class="font-bold text-lg mb-4">
        ชำระเงินผ่าน PromptPay
      </h2>

      <div class="flex flex-col items-center">
        <img id="qrImage" class="w-72 max-w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-white" />

        <p id="txtPromptpay" class="mt-4 text-sm text-slate-500 dark:text-slate-400">PromptPay</p>
        <p id="promptpayNumber" class="font-bold text-xl">-</p>

        <p id="txtTotalPay" class="mt-2 text-sm text-slate-500 dark:text-slate-400">ยอดชำระ</p>
        <p id="totalAmountText" class="text-4xl font-bold text-emerald-600">฿0.00</p>

        <p id="txtSlipDesc" class="mt-3 text-xs text-slate-400 text-center">
          หลังชำระเงิน กรุณาแนบสลิปเพื่อให้แอดมินตรวจสอบ
        </p>
      </div>
    </section>

    <section class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm mt-4 transition">
      <h2 id="txtUploadSlip" class="font-bold text-lg mb-4">
        แนบสลิปชำระเงิน
      </h2>

      <input
        id="slipInput"
        type="file"
        accept="image/*"
        class="w-full bg-slate-50 dark:bg-slate-800 rounded-2xl p-4"
      />

      <img
        id="slipPreview"
        class="hidden mt-4 rounded-2xl w-full object-cover border border-slate-200 dark:border-slate-700"
      />
    </section>

  </main>

  <footer class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t dark:border-slate-800 shadow-lg transition">
    <div class="max-w-4xl mx-auto p-4">
      <div class="flex justify-between items-center gap-3">
        <div>
          <p id="txtSummary" class="text-xs text-slate-500 dark:text-slate-400">รวมทั้งหมด</p>

          <p class="text-xl font-bold">
            <span id="totalItems">0</span>
            <span id="txtPhotoUnit">ภาพ</span>
            ·
            ฿<span id="totalAmount">0.00</span>
          </p>
        </div>

        <button
          id="submitBtn"
          onclick="submitOrder()"
          class="bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl px-5 py-3 font-bold disabled:opacity-40"
        >
          <span id="txtSubmit">ยืนยันส่งสลิป</span>
        </button>
      </div>
    </div>
  </footer>

  <script>
    const db = window.sb || window.supabaseClient;

    let profile = null;
    let cartKey = null;
    let cart = [];
    let eventId = null;
    let isSubmitting = false;

    const NORMAL_PHOTO_PRICE = 50;

    function calculatePromoTotal(count) {
      if (count >= 20) {
        return 500 + ((count - 20) * NORMAL_PHOTO_PRICE);
      }

      if (count >= 10) {
        return 250 + ((count - 10) * NORMAL_PHOTO_PRICE);
      }

      return count * NORMAL_PHOTO_PRICE;
    }

    function calculateNormalTotal(count) {
      return count * NORMAL_PHOTO_PRICE;
    }

    function calculateSaving(count) {
      return calculateNormalTotal(count) - calculatePromoTotal(count);
    }

    const LANG = {
      th: {
        miniApp: "LINE Mini App",
        pageTitle: "ชำระเงิน",
        pageDesc: "ตรวจสอบรายการและแนบสลิป",
        back: "กลับ",
        connected: "เชื่อมต่อ LINE แล้ว",
        promptpayTitle: "ชำระเงินผ่าน PromptPay",
        promptpay: "PromptPay",
        totalPay: "ยอดชำระ",
        slipDesc: "หลังชำระเงิน กรุณาแนบสลิปเพื่อให้แอดมินตรวจสอบ",
        uploadSlip: "แนบสลิปชำระเงิน",
        summary: "รวมทั้งหมด",
        photoUnit: "ภาพ",
        submit: "ยืนยันส่งสลิป",
        emptyCart: "ตะกร้าว่าง",
        emptyCartDesc: "กรุณาเลือกภาพก่อน",
        backHome: "กลับหน้าแรก",
        sendingSlip: "กำลังส่งสลิป...",
        telegramNotify: "กำลังสร้าง Order และแจ้งแอดมิน",
        uploadSlipFirst: "กรุณาแนบสลิป",
        orderSuccess: "ส่งสลิปสำเร็จ",
        waitApprove: "ระบบแจ้งแอดมินแล้ว กรุณารอการอนุมัติ",
        viewOrder: "ดูออเดอร์",
        errorTitle: "เกิดข้อผิดพลาด",
        promoTitle: "🎉 โปรเหมา",
        promoDesc: "ซื้อครบ 10 รูป เหลือ 250 บาท • 20 รูป เหลือ 500 บาท",
        saving: "ประหยัด",
        normalPrice: "ราคาปกติ",
        photoEvent: "Photo Event"
      },

      en: {
        miniApp: "LINE Mini App",
        pageTitle: "Checkout",
        pageDesc: "Review your order and upload payment slip",
        back: "Back",
        connected: "LINE Connected",
        promptpayTitle: "Pay with PromptPay",
        promptpay: "PromptPay",
        totalPay: "Total Payment",
        slipDesc: "After payment, please upload your slip for verification",
        uploadSlip: "Upload Payment Slip",
        summary: "Total",
        photoUnit: "photos",
        submit: "Submit Slip",
        emptyCart: "Cart Empty",
        emptyCartDesc: "Please select photos first",
        backHome: "Back Home",
        sendingSlip: "Uploading slip...",
        telegramNotify: "Creating order and notifying admin",
        uploadSlipFirst: "Please upload payment slip",
        orderSuccess: "Slip submitted successfully",
        waitApprove: "Admin has been notified. Please wait for approval.",
        viewOrder: "View Orders",
        errorTitle: "Error",
        promoTitle: "🎉 Package Deal",
        promoDesc: "10 photos for 250 THB • 20 photos for 500 THB",
        saving: "Save",
        normalPrice: "Normal price",
        photoEvent: "Photo Event"
      },

      ru: {
        miniApp: "LINE Мини-приложение",
        pageTitle: "Оплата",
        pageDesc: "Проверьте заказ и загрузите чек",
        back: "Назад",
        connected: "LINE подключён",
        promptpayTitle: "Оплата через PromptPay",
        promptpay: "PromptPay",
        totalPay: "Сумма оплаты",
        slipDesc: "После оплаты загрузите чек для проверки администратором",
        uploadSlip: "Загрузить чек",
        summary: "Итого",
        photoUnit: "фото",
        submit: "Отправить чек",
        emptyCart: "Корзина пуста",
        emptyCartDesc: "Пожалуйста, выберите фотографии",
        backHome: "На главную",
        sendingSlip: "Отправка чека...",
        telegramNotify: "Создание заказа и уведомление администратора",
        uploadSlipFirst: "Пожалуйста, загрузите чек",
        orderSuccess: "Чек успешно отправлен",
        waitApprove: "Администратор уведомлён. Ожидайте подтверждения.",
        viewOrder: "Мои заказы",
        errorTitle: "Ошибка",
        promoTitle: "🎉 Пакетное предложение",
        promoDesc: "10 фото за 250 THB • 20 фото за 500 THB",
        saving: "Экономия",
        normalPrice: "Обычная цена",
        photoEvent: "Фото Событие"
      }
    };

    let currentLang = localStorage.getItem("lang") || "th";

    function t() {
      return LANG[currentLang] || LANG.th;
    }

    function applyLanguage() {
      const x = t();

      document.documentElement.lang = currentLang;

      document.getElementById("txtMiniApp").textContent = x.miniApp;
      document.getElementById("txtPageTitle").textContent = x.pageTitle;
      document.getElementById("txtPageDesc").textContent = x.pageDesc;
      document.getElementById("txtBack").textContent = x.back;
      document.getElementById("txtConnected").textContent = x.connected;
      document.getElementById("txtPromptpayTitle").textContent = x.promptpayTitle;
      document.getElementById("txtPromptpay").textContent = x.promptpay;
      document.getElementById("txtTotalPay").textContent = x.totalPay;
      document.getElementById("txtSlipDesc").textContent = x.slipDesc;
      document.getElementById("txtUploadSlip").textContent = x.uploadSlip;
      document.getElementById("txtSummary").textContent = x.summary;
      document.getElementById("txtPhotoUnit").textContent = x.photoUnit;
      document.getElementById("txtSubmit").textContent = x.submit;
      document.getElementById("txtPromoTitle").textContent = x.promoTitle;
      document.getElementById("txtPromoDesc").textContent = x.promoDesc;
      document.getElementById("langSelect").value = currentLang;
    }

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);

      applyLanguage();
      renderCart();
      updateSummary();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        initDarkMode();
        applyLanguage();

        if (!db) {
          throw new Error("ไม่พบ Supabase client");
        }

        profile = await AppLIFF.init();
        if (!profile) return;

        cartKey = AppLIFF.getCartKey();

        showProfile();
        loadCart();

        if (!cart.length) {
          Swal.fire({
            icon: "warning",
            title: t().emptyCart,
            text: t().emptyCartDesc,
            confirmButtonText: t().backHome
          }).then(() => {
            window.location.href = "index.html";
          });

          return;
        }

        renderCart();
        generateQR();

        document.getElementById("slipInput").addEventListener("change", previewSlip);

      } catch (err) {
        console.error(err);

        Swal.fire(
          t().errorTitle,
          err.message || "โหลดหน้าไม่สำเร็จ",
          "error"
        );
      }
    });

    function showProfile() {
      document.getElementById("profileBox").classList.remove("hidden");

      document.getElementById("lineName").textContent =
        profile.displayName || "LINE User";

      document.getElementById("linePicture").src =
        profile.pictureUrl || "https://placehold.co/100x100?text=LINE";
    }

    function loadCart() {
      cart = JSON.parse(localStorage.getItem(cartKey) || "[]");
      cart = cart.filter(item => item && item.photo_id);

      if (cart.length > 0) {
        eventId = cart[0].event_id || getEventIdFromUrl();
      }
    }

    function getEventIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("event") || params.get("event_id") || params.get("id") || null;
    }

    function getPromoData() {
      const saved = JSON.parse(localStorage.getItem(`${cartKey}_promo`) || "{}");

      const count = cart.length;

      return {
        promo_total: Number(saved.promo_total ?? calculatePromoTotal(count)),
        normal_total: Number(saved.normal_total ?? calculateNormalTotal(count)),
        saving: Number(saved.saving ?? calculateSaving(count)),
        item_count: count,
        normal_photo_price: NORMAL_PHOTO_PRICE
      };
    }

    function getTotalAmount() {
      return Number(getPromoData().promo_total || 0);
    }

    function renderCart() {
      const list = document.getElementById("cartList");
      list.innerHTML = "";

      cart.forEach(item => {
        const img =
          item.preview_url ||
          item.watermark_url ||
          item.watermarked_url ||
          "https://placehold.co/300x400?text=Photo";

        const card = document.createElement("article");

        card.className =
          "bg-white dark:bg-slate-900 rounded-3xl p-3 shadow-sm flex gap-3 transition";

        card.innerHTML = `
          <img
            src="${img}"
            class="w-24 h-28 rounded-2xl object-cover bg-slate-200 dark:bg-slate-800"
          />

          <div class="flex-1 min-w-0">
            <p class="font-bold truncate">
              ${escapeHtml(item.file_name || item.filename || item.photo_id)}
            </p>

            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">
              ${escapeHtml(item.event_name || t().photoEvent)}
            </p>

            <p class="mt-2 text-lg font-bold text-emerald-600">
              ฿${formatMoney(NORMAL_PHOTO_PRICE)}
            </p>
          </div>
        `;

        list.appendChild(card);
      });

      updateSummary();
    }

    function updateSummary() {
      const totalItems = cart.length;
      const promoData = getPromoData();
      const totalAmount = getTotalAmount();

      document.getElementById("totalItems").textContent = totalItems;
      document.getElementById("totalAmount").textContent = formatMoney(totalAmount);
      document.getElementById("totalAmountText").textContent = `฿${formatMoney(totalAmount)}`;

      const savingText = document.getElementById("promoSavingText");

      if (promoData.saving > 0) {
        savingText.textContent =
          `${t().saving} ฿${formatMoney(promoData.saving)} · ${t().normalPrice} ฿${formatMoney(promoData.normal_total)}`;
        savingText.classList.remove("hidden");
      } else {
        savingText.classList.add("hidden");
      }
    }

    function generateQR() {
      const totalAmount = getTotalAmount();

      const number =
        CONFIG.PAYMENT?.PROMPTPAY_NUMBER ||
        CONFIG.PROMPTPAY_NUMBER ||
        "0936494961";

      document.getElementById("promptpayNumber").textContent = number;

      document.getElementById("qrImage").src =
        `https://promptpay.io/${number}/${totalAmount}.png`;
    }

    function previewSlip(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = e => {
        const img = document.getElementById("slipPreview");
        img.src = e.target.result;
        img.classList.remove("hidden");
      };

      reader.readAsDataURL(file);
    }

    async function submitOrder() {
      if (isSubmitting) return;

      try {
        const slipFile = document.getElementById("slipInput").files[0];

        if (!slipFile) {
          Swal.fire(t().uploadSlipFirst, "", "warning");
          return;
        }

        if (!cart.length) {
          Swal.fire(t().emptyCart, t().emptyCartDesc, "warning");
          return;
        }

        isSubmitting = true;
        document.getElementById("submitBtn").disabled = true;

        const totalAmount = getTotalAmount();
        const promoData = getPromoData();

        Swal.fire({
          title: t().sendingSlip,
          text: t().telegramNotify,
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        const ext = slipFile.name.split(".").pop()?.toLowerCase() || "jpg";
        const filePath = `slips/${profile.userId}/${Date.now()}.${ext}`;
        const slipBucket = CONFIG.STORAGE_BUCKETS?.SLIPS || "slips";

        const { error: uploadError } = await db.storage
          .from(slipBucket)
          .upload(filePath, slipFile, {
            cacheControl: "3600",
            upsert: true
          });

        if (uploadError) throw uploadError;

        const { data: publicData } = db.storage
          .from(slipBucket)
          .getPublicUrl(filePath);

        const slipUrl = publicData.publicUrl;
        const orderNo = "ORD-" + Date.now();

        const { data: orderData, error: orderError } = await db
          .from("orders")
          .insert({
            order_no: orderNo,
            line_user_id: profile.userId,
            line_display_name: profile.displayName || null,
            line_picture: profile.pictureUrl || null,
            event_id: eventId,
            total_amount: totalAmount,
            status: "waiting_approve",
            slip_url: slipUrl
          })
          .select()
          .single();

        if (orderError) throw orderError;

        const orderId = orderData.id;

        const perPhotoPrice =
          cart.length > 0
            ? Number((totalAmount / cart.length).toFixed(2))
            : NORMAL_PHOTO_PRICE;

        const orderItems = cart.map(item => ({
          order_id: orderId,
          photo_id: item.photo_id,
          price: perPhotoPrice
        }));

        const { error: itemError } = await db
          .from("order_items")
          .insert(orderItems);

        if (itemError) throw itemError;

        const { error: paymentError } = await db
          .from("payments")
          .insert({
            order_id: orderId,
            line_user_id: profile.userId,
            amount: totalAmount,
            slip_url: slipUrl,
            status: "waiting_approve"
          });

        if (paymentError) throw paymentError;

        await notifyTelegram(orderId);

        localStorage.removeItem(cartKey);
        localStorage.removeItem(`${cartKey}_promo`);

        Swal.fire({
          icon: "success",
          title: t().orderSuccess,
          html: `
            <div style="text-align:left">
              <p><b>Order:</b> ${orderNo}</p>
              <p><b>Amount:</b> ฿${formatMoney(totalAmount)}</p>
              ${promoData.saving > 0 ? `
                <p><b>Promotion saving:</b> ฿${formatMoney(promoData.saving)}</p>
              ` : ""}
              <p style="margin-top:8px;color:#64748b">
                ${t().waitApprove}
              </p>
            </div>
          `,
          confirmButtonText: t().viewOrder
        }).then(() => {
          window.location.href = "order.html";
        });

      } catch (err) {
        console.error(err);

        Swal.fire(
          t().errorTitle,
          err.message || "ไม่สามารถส่งสลิปได้",
          "error"
        );

      } finally {
        isSubmitting = false;
        document.getElementById("submitBtn").disabled = false;
      }
    }

    async function notifyTelegram(orderId) {
      try {
        const res = await fetch(
          `${CONFIG.SUPABASE_URL}/functions/v1/send-slip-telegram`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              order_id: orderId
            })
          }
        );

        const data = await res.json().catch(() => ({}));

        if (!res.ok || data.success === false) {
          console.warn("Telegram notify failed:", data);
        }

      } catch (err) {
        console.warn("Telegram notify error:", err.message);
      }
    }

    function goCart() {
      window.location.href = "cart.html";
    }

    function formatMoney(value) {
      return Number(value || 0).toLocaleString("th-TH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle("dark");

      const isDark = html.classList.contains("dark");

      localStorage.setItem("darkMode", isDark ? "1" : "0");

      updateDarkButton();
    }

    function updateDarkButton() {
      const btn = document.getElementById("darkBtn");
      if (!btn) return;

      const isDark = document.documentElement.classList.contains("dark");
      btn.innerHTML = isDark ? "☀️ Light" : "🌙 Dark";
    }

    function initDarkMode() {
      const saved = localStorage.getItem("darkMode");

      if (saved === "1") {
        document.documentElement.classList.add("dark");
      }

      updateDarkButton();
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

<!-- ปิดปุ่มลัดบางอย่าง -->
<script>
document.addEventListener('keydown', function(e) {

  // F12
  if (e.key === "F12") {
    e.preventDefault();
  }

  // Ctrl+S / Cmd+S
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
  }

  // Ctrl+U
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
    e.preventDefault();
  }

  // Ctrl+Shift+I
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
  }

});
</script>
</body>
</html>
