<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KEITA PHOTO - Event</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 min-h-screen">

  <header class="bg-black text-white p-5">
    <h1 class="text-2xl font-bold">KEITA PHOTO</h1>
    <p class="text-sm text-gray-300">ระบบค้นหาและสั่งซื้อภาพงานวิ่ง</p>
  </header>

  <main class="p-4 max-w-5xl mx-auto">
    <div class="mb-5">
      <h2 class="text-xl font-bold text-slate-800">เลือกงาน Event</h2>
      <p class="text-sm text-slate-500">เลือกงานที่ต้องการค้นหารูปภาพ</p>
    </div>

    <div id="loading" class="text-center text-slate-500 py-10">
      กำลังโหลดข้อมูล...
    </div>

    <div id="eventGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </main>

  <script src="js/config.js"></script>

  <script>
    async function loadEvents() {
      const loading = document.getElementById("loading");
      const eventGrid = document.getElementById("eventGrid");

      const { data, error } = await supabaseClient
        .from("events")
        .select("*")
        .eq("status", "published")
        .order("event_date", { ascending: false });

      loading.style.display = "none";

      if (error) {
        console.error(error);
        eventGrid.innerHTML = `
          <div class="col-span-full bg-red-100 text-red-700 p-4 rounded-xl">
            โหลดข้อมูลไม่สำเร็จ: ${error.message}
          </div>
        `;
        return;
      }

      if (!data || data.length === 0) {
        eventGrid.innerHTML = `
          <div class="col-span-full bg-white p-6 rounded-xl text-center text-slate-500">
            ยังไม่มี Event ที่เปิดใช้งาน
          </div>
        `;
        return;
      }

      eventGrid.innerHTML = data.map(event => `
        <div class="bg-white rounded-2xl shadow overflow-hidden">
          <div class="h-44 bg-slate-300">
            ${
              event.cover_url
                ? `<img src="${event.cover_url}" class="w-full h-full object-cover">`
                : `<div class="w-full h-full flex items-center justify-center text-slate-500">ไม่มีภาพปก</div>`
            }
          </div>

          <div class="p-4">
            <h3 class="font-bold text-lg text-slate-800">${event.title}</h3>
            <p class="text-sm text-slate-500 mt-1">${event.location || ""}</p>
            <p class="text-sm text-slate-400 mt-1">${event.event_date || ""}</p>

            <a 
              href="event.html?event=${event.id}"
              class="block mt-4 bg-black text-white text-center py-2 rounded-xl font-semibold"
            >
              ดูรูปภาพ
            </a>
          </div>
        </div>
      `).join("");
    }

    loadEvents();
  </script>

</body>
</html>
