<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart - KEITA PHOTO</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<header class="bg-black text-white p-5">
  <a href="index.html" class="text-sm text-gray-300">← กลับหน้า Event</a>
  <h1 class="text-2xl font-bold mt-2">ตะกร้าสินค้า</h1>
</header>

<main class="max-w-4xl mx-auto p-4">

  <div id="cartList" class="space-y-3"></div>

  <div class="bg-white rounded-2xl shadow p-5 mt-5">
    <div class="flex justify-between items-center text-lg font-bold">
      <span>ยอดรวม</span>
      <span id="totalAmount">฿0</span>
    </div>

    <a
      href="checkout.html"
      id="checkoutBtn"
      class="block mt-5 bg-black text-white text-center py-3 rounded-xl font-semibold"
    >
      ไปชำระเงิน
    </a>
  </div>

</main>

<script src="js/config.js"></script>

<script>
  const cartList = document.getElementById("cartList");
  const totalAmount = document.getElementById("totalAmount");
  const checkoutBtn = document.getElementById("checkoutBtn");

  async function loadCart() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
      cartList.innerHTML = `
        <div class="bg-white p-6 rounded-2xl text-center text-slate-500">
          ยังไม่มีรูปในตะกร้า
        </div>
      `;
      checkoutBtn.classList.add("opacity-50", "pointer-events-none");
      return;
    }

    const { data, error } = await supabaseClient
      .from("photos")
      .select("*")
      .in("id", cart);

    if (error) {
      console.error(error);
      cartList.innerHTML = `
        <div class="bg-red-100 text-red-700 p-4 rounded-xl">
          โหลดตะกร้าไม่สำเร็จ: ${error.message}
        </div>
      `;
      return;
    }

    let total = 0;

    cartList.innerHTML = data.map(photo => {
      total += Number(photo.price || 0);

      return `
        <div class="bg-white rounded-2xl shadow p-3 flex gap-3 items-center">
          <img
            src="${photo.preview_url || photo.watermark_url}"
            class="w-24 h-24 object-cover rounded-xl bg-slate-200"
          />

          <div class="flex-1">
            <p class="font-bold text-slate-800">${photo.filename || "Photo"}</p>
            <p class="text-slate-500">฿${photo.price || 0}</p>
          </div>

          <button
            onclick="removeFromCart('${photo.id}')"
            class="bg-red-100 text-red-700 px-3 py-2 rounded-xl text-sm"
          >
            ลบ
          </button>
        </div>
      `;
    }).join("");

    totalAmount.innerText = `฿${total}`;
    localStorage.setItem("cart_total", total);
  }

  function removeFromCart(photoId) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart = cart.filter(id => id !== photoId);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
  }

  loadCart();
</script>

</body>
</html>
