<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ตะกร้าสินค้า</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js"></script>
  <script src="js/liff-helper.js"></script>
</head>

<body class="bg-slate-100 text-slate-800">
  <main class="max-w-4xl mx-auto p-4 pb-32">

    <header class="bg-white rounded-3xl p-4 shadow-sm mb-4">
      <div class="flex justify-between gap-3">
        <div>
          <p class="text-xs text-slate-500">LINE Mini App</p>
          <h1 class="text-xl font-bold">ตะกร้าสินค้า</h1>
          <p id="cartDesc" class="text-sm text-slate-500">กำลังโหลดข้อมูล...</p>
        </div>

        <button onclick="goHome()" class="bg-white border border-slate-200 rounded-full px-4 py-2 font-bold">
          หน้าแรก
        </button>
      </div>

      <div id="profileBox" class="hidden mt-4 bg-slate-50 rounded-2xl p-3">
        <div class="flex items-center gap-3">
          <img id="linePicture" class="w-11 h-11 rounded-full object-cover bg-slate-200" />
          <div>
            <p id="lineName" class="font-bold">-</p>
            <p class="text-xs text-emerald-600">เชื่อมต่อ LINE แล้ว</p>
          </div>
        </div>
      </div>
    </header>

    <section id="cartList" class="space-y-3"></section>

    <section id="emptyBox" class="hidden text-center py-16">
      <p class="text-5xl">🛒</p>
      <h2 class="mt-3 text-lg font-bold">ยังไม่มีสินค้าในตะกร้า</h2>
      <p class="text-sm text-slate-500 mt-1">กรุณาเลือกภาพจาก Event ก่อน</p>
      <button onclick="goHome()" class="mt-5 bg-slate-900 text-white rounded-2xl px-5 py-3 font-bold">
        เลือก Event
      </button>
    </section>

  </main>

  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg">
    <div class="max-w-4xl mx-auto p-4">
      <div class="flex justify-between items-center gap-3">
        <div>
          <p class="text-xs text-slate-500">รวมทั้งหมด</p>
          <p class="text-xl font-bold">
            <span id="totalItems">0</span> ภาพ · ฿<span id="totalAmount">0.00</span>
          </p>
        </div>

        <button
          id="checkoutBtn"
          onclick="goCheckout()"
          disabled
          class="bg-slate-900 text-white rounded-2xl px-5 py-3 font-bold disabled:opacity-40"
        >
          ชำระเงิน
        </button>
      </div>
    </div>
  </footer>

  <script>
    let profile = null;
    let cartKey = null;
    let cart = [];

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        profile = await AppLIFF.init();
        if (!profile) return;

        cartKey = AppLIFF.getCartKey();

        showProfile();
        loadCart();
        renderCart();

      } catch (err) {
        console.error(err);
        Swal.fire("เกิดข้อผิดพลาด", err.message || "โหลดตะกร้าไม่สำเร็จ", "error");
      }
    });

    function showProfile() {
      document.getElementById("profileBox").classList.remove("hidden");
      document.getElementById("lineName").textContent = profile.displayName || "LINE User";
      document.getElementById("linePicture").src =
        profile.pictureUrl || "https://placehold.co/100x100?text=LINE";
    }

    function loadCart() {
      cart = JSON.parse(localStorage.getItem(cartKey) || "[]");
      cart = cart.filter(item => item && item.photo_id);
    }

    function saveCart() {
      localStorage.setItem(cartKey, JSON.stringify(cart));
    }

    function renderCart() {
      const list = document.getElementById("cartList");
      const empty = document.getElementById("emptyBox");
      const checkoutBtn = document.getElementById("checkoutBtn");

      list.innerHTML = "";

      if (!cart.length) {
        list.classList.add("hidden");
        empty.classList.remove("hidden");
        checkoutBtn.disabled = true;
        updateSummary();
        return;
      }

      list.classList.remove("hidden");
      empty.classList.add("hidden");
      checkoutBtn.disabled = false;

      cart.forEach((item, index) => {
        const price = Number(item.price || 0);
        const img = item.preview_url || item.watermarked_url || item.thumbnail_url || "https://placehold.co/300x400?text=Photo";

        const card = document.createElement("article");
        card.className = "bg-white rounded-3xl p-3 shadow-sm flex gap-3";

        card.innerHTML = `
          <img src="${img}" class="w-24 h-28 rounded-2xl object-cover bg-slate-200" />

          <div class="flex-1 min-w-0">
            <p class="font-bold truncate">${escapeHtml(item.file_name || item.photo_id)}</p>
            <p class="text-xs text-slate-500 truncate">${escapeHtml(item.event_name || "Photo Event")}</p>
            <p class="mt-2 text-lg font-bold text-emerald-600">฿${formatMoney(price)}</p>

            <div class="mt-3 flex gap-2">
              <button onclick="removeItem(${index})" class="bg-red-50 text-red-600 rounded-xl px-3 py-2 text-sm font-bold">
                ลบ
              </button>
            </div>
          </div>
        `;

        list.appendChild(card);
      });

      updateSummary();
    }

    function updateSummary() {
      const totalItems = cart.length;
      const totalAmount = cart.reduce((sum, item) => sum + Number(item.price || 0), 0);

      document.getElementById("cartDesc").textContent =
        totalItems > 0 ? `มีภาพในตะกร้า ${totalItems} ภาพ` : "ยังไม่มีสินค้าในตะกร้า";

      document.getElementById("totalItems").textContent = totalItems;
      document.getElementById("totalAmount").textContent = formatMoney(totalAmount);
    }

    function removeItem(index) {
      cart.splice(index, 1);
      saveCart();
      renderCart();
    }

    function goCheckout() {
      if (!cart.length) {
        Swal.fire("ตะกร้าว่าง", "กรุณาเลือกภาพก่อนชำระเงิน", "warning");
        return;
      }

      const eventId = cart[0]?.event_id || "";
      window.location.href = `checkout.html?event=${encodeURIComponent(eventId)}`;
    }

    function goHome() {
      window.location.href = "index.html";
    }

    function formatMoney(value) {
      return Number(value || 0).toLocaleString("th-TH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

  <!-- ห้ามคลิกขวา -->
<script>
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});
</script>

<!-- ห้ามกดค้างบันทึกภาพบนมือถือ -->
<style>
img {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  pointer-events: none;
}

body {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
</style>

<!-- ปิดการลากรูป -->
<script>
document.addEventListener('dragstart', function(e) {
  e.preventDefault();
});
</script>

<!-- ปิดปุ่มลัดบางอย่าง -->
<script>
document.addEventListener('keydown', function(e) {

  // F12
  if (e.key === "F12") {
    e.preventDefault();
  }

  // Ctrl+S / Cmd+S
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
  }

  // Ctrl+U
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
    e.preventDefault();
  }

  // Ctrl+Shift+I
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
  }

});
</script>
</body>
</html>
