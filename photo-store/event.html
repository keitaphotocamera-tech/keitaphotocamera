<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เลือกภาพถ่าย</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js"></script>
  <script src="js/liff-helper.js"></script>
</head>

<body class="bg-slate-100 text-slate-800">
  <main class="max-w-5xl mx-auto p-4 pb-28">

    <header class="bg-white rounded-3xl p-4 shadow-sm mb-4">
      <div class="flex justify-between gap-3">
        <div>
          <p class="text-xs text-slate-500">LINE Mini App</p>
          <h1 id="eventTitle" class="text-xl font-bold">เลือกภาพถ่าย</h1>
          <p id="eventDesc" class="text-sm text-slate-500">กำลังโหลดข้อมูล...</p>
        </div>

        <button onclick="goCart()" class="relative bg-slate-900 text-white rounded-full px-4 py-2 font-bold">
          🛒 ตะกร้า
          <span id="cartCount" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full min-w-6 h-6 items-center justify-center">0</span>
        </button>
      </div>

      <div id="profileBox" class="hidden mt-4 bg-slate-50 rounded-2xl p-3">
        <div class="flex items-center gap-3">
          <img id="linePicture" class="w-11 h-11 rounded-full object-cover" />
          <div>
            <p id="lineName" class="font-bold">-</p>
            <p class="text-xs text-emerald-600">เชื่อมต่อ LINE แล้ว</p>
          </div>
        </div>
      </div>
    </header>

    <section class="mb-4 grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-3">
      <input
        id="searchInput"
        oninput="searchPhotos()"
        class="bg-white rounded-2xl px-4 py-3 outline-none shadow-sm"
        placeholder="ค้นหาชื่อไฟล์ / หมายเลขภาพ"
      />

      <button onclick="openFaceSearch()" class="bg-white rounded-2xl px-4 py-3 font-bold shadow-sm">
        🙂 ค้นหาด้วยใบหน้า
      </button>
    </section>

    <section class="bg-white rounded-3xl p-4 shadow-sm mb-4 grid grid-cols-3 text-center">
      <div>
        <p class="text-xs text-slate-500">ภาพทั้งหมด</p>
        <p id="photoTotal" class="text-2xl font-bold">0</p>
      </div>
      <div>
        <p class="text-xs text-slate-500">เลือกแล้ว</p>
        <p id="selectedTotal" class="text-2xl font-bold">0</p>
      </div>
      <div>
        <p class="text-xs text-slate-500">รวมเงิน</p>
        <p id="selectedAmount" class="text-2xl font-bold text-emerald-600">0</p>
      </div>
    </section>

    <section id="loadingBox" class="text-center py-10 text-slate-500">
      กำลังโหลดภาพ...
    </section>

    <section id="photoGrid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></section>

    <section id="emptyBox" class="hidden text-center py-10">
      <p class="text-4xl">🖼️</p>
      <p class="mt-2 font-bold">ไม่พบภาพในงานนี้</p>
    </section>

  </main>

  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg">
    <div class="max-w-5xl mx-auto p-4 flex justify-between items-center">
      <div>
        <p class="text-xs text-slate-500">เลือกแล้ว</p>
        <p class="font-bold">
          <span id="bottomSelected">0</span> ภาพ · ฿<span id="bottomAmount">0.00</span>
        </p>
      </div>

      <button
        id="addCartBtn"
        onclick="addSelectedToCart()"
        disabled
        class="bg-slate-900 text-white rounded-2xl px-5 py-3 font-bold disabled:opacity-40"
      >
        เพิ่มลงตะกร้า
      </button>
    </div>
  </footer>

  <script>
    let profile = null;
    let eventId = null;
    let eventData = null;
    let allPhotos = [];
    let filteredPhotos = [];
    let selectedPhotos = new Map();

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        eventId = getEventId();

        if (!eventId) {
          throw new Error("ไม่พบ event id เช่น event.html?event=xxxx");
        }

        profile = await AppLIFF.init();
        if (!profile) return;

        showProfile();
        await saveUser();
        await loadEvent();
        await loadPhotos();
        updateCartCount();

      } catch (err) {
        console.error(err);
        Swal.fire("เกิดข้อผิดพลาด", err.message, "error");
      }
    });

    function getEventId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("event") || params.get("event_id") || params.get("id");
    }

    function showProfile() {
      document.getElementById("profileBox").classList.remove("hidden");
      document.getElementById("lineName").textContent = profile.displayName || "LINE User";
      document.getElementById("linePicture").src =
        profile.pictureUrl || "https://placehold.co/100x100?text=LINE";
    }

    async function saveUser() {
      await sb.from("users").upsert({
        line_user_id: profile.userId,
        line_display_name: profile.displayName || null,
        line_picture: profile.pictureUrl || null,
        updated_at: new Date().toISOString()
      }, {
        onConflict: "line_user_id"
      });
    }

    async function loadEvent() {
      const { data, error } = await sb
        .from("events")
        .select("*")
        .eq("id", eventId)
        .single();

      if (error) throw error;

      eventData = data;

      document.getElementById("eventTitle").textContent =
        data.name || data.title || "เลือกภาพถ่าย";

      document.getElementById("eventDesc").textContent =
        data.description || "เลือกรูปที่ต้องการ แล้วเพิ่มลงตะกร้า";
    }

    async function loadPhotos() {
      const { data, error } = await sb
        .from("photos")
        .select("*")
        .eq("event_id", eventId)
        .order("created_at", { ascending: false });

      if (error) throw error;

      allPhotos = data || [];
      filteredPhotos = allPhotos;

      document.getElementById("photoTotal").textContent = allPhotos.length;
      document.getElementById("loadingBox").classList.add("hidden");

      renderPhotos();
    }

    function renderPhotos() {
      const grid = document.getElementById("photoGrid");
      const empty = document.getElementById("emptyBox");

      grid.innerHTML = "";

      if (!filteredPhotos.length) {
        grid.classList.add("hidden");
        empty.classList.remove("hidden");
        return;
      }

      empty.classList.add("hidden");
      grid.classList.remove("hidden");

      filteredPhotos.forEach(photo => {
        const price = getPhotoPrice(photo);
        const img = getPhotoUrl(photo);
        const checked = selectedPhotos.has(photo.id) ? "checked" : "";

        const el = document.createElement("label");
        el.className = "bg-white rounded-3xl overflow-hidden shadow-sm cursor-pointer block";

        el.innerHTML = `
          <input type="checkbox" class="hidden" ${checked} onchange="togglePhoto('${photo.id}')">

          <div class="relative aspect-[3/4] bg-slate-200">
            <img src="${img}" class="w-full h-full object-cover">

            <div class="absolute top-2 right-2 bg-white/90 rounded-full px-2 py-1 text-xs font-bold">
              ฿${formatMoney(price)}
            </div>

            <div class="absolute bottom-0 left-0 right-0 bg-black/50 text-white p-2 text-xs">
              ${escapeHtml(photo.file_name || photo.name || photo.id)}
            </div>
          </div>
        `;

        grid.appendChild(el);
      });

      updateSelectedSummary();
    }

    function togglePhoto(photoId) {
      const photo = allPhotos.find(p => String(p.id) === String(photoId));
      if (!photo) return;

      if (selectedPhotos.has(photo.id)) {
        selectedPhotos.delete(photo.id);
      } else {
        selectedPhotos.set(photo.id, photo);
      }

      updateSelectedSummary();
    }

    function updateSelectedSummary() {
      const count = selectedPhotos.size;
      const amount = [...selectedPhotos.values()]
        .reduce((sum, photo) => sum + getPhotoPrice(photo), 0);

      document.getElementById("selectedTotal").textContent = count;
      document.getElementById("selectedAmount").textContent = formatMoney(amount);
      document.getElementById("bottomSelected").textContent = count;
      document.getElementById("bottomAmount").textContent = formatMoney(amount);

      document.getElementById("addCartBtn").disabled = count === 0;
    }

    function addSelectedToCart() {
      if (!profile?.userId) {
        Swal.fire("กรุณาเข้าสู่ระบบ LINE", "", "warning");
        return;
      }

      const cartKey = AppLIFF.getCartKey();
      const oldCart = JSON.parse(localStorage.getItem(cartKey) || "[]");
      const map = new Map(oldCart.map(item => [String(item.photo_id), item]));

      selectedPhotos.forEach(photo => {
        map.set(String(photo.id), {
          event_id: eventId,
          event_name: eventData?.name || eventData?.title || "",
          photo_id: photo.id,
          file_name: photo.file_name || photo.name || "",
          preview_url: getPhotoUrl(photo),
          price: getPhotoPrice(photo),
          line_user_id: profile.userId
        });
      });

      localStorage.setItem(cartKey, JSON.stringify([...map.values()]));

      selectedPhotos.clear();
      renderPhotos();
      updateCartCount();

      Swal.fire({
        icon: "success",
        title: "เพิ่มลงตะกร้าแล้ว",
        showCancelButton: true,
        confirmButtonText: "ไปตะกร้า",
        cancelButtonText: "เลือกต่อ"
      }).then(result => {
        if (result.isConfirmed) goCart();
      });
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem(AppLIFF.getCartKey()) || "[]");
      const badge = document.getElementById("cartCount");

      badge.textContent = cart.length;

      if (cart.length > 0) {
        badge.classList.remove("hidden");
        badge.classList.add("inline-flex");
      } else {
        badge.classList.add("hidden");
        badge.classList.remove("inline-flex");
      }
    }

    function searchPhotos() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();

      if (!keyword) {
        filteredPhotos = allPhotos;
      } else {
        filteredPhotos = allPhotos.filter(photo => {
          const text = [
            photo.file_name,
            photo.name,
            photo.id,
            photo.description
          ].filter(Boolean).join(" ").toLowerCase();

          return text.includes(keyword);
        });
      }

      renderPhotos();
    }

    function goCart() {
      window.location.href = `cart.html?event=${encodeURIComponent(eventId)}`;
    }

    function openFaceSearch() {
      window.location.href = `face-search.html?event=${encodeURIComponent(eventId)}`;
    }

    function getPhotoPrice(photo) {
      return Number(
        photo.price ||
        eventData?.photo_price ||
        CONFIG.DEFAULT_PHOTO_PRICE ||
        0
      );
    }

    function getPhotoUrl(photo) {
      return (
        photo.watermarked_url ||
        photo.preview_url ||
        photo.thumbnail_url ||
        photo.public_url ||
        photo.url ||
        photo.full_url ||
        "https://placehold.co/600x800?text=Photo"
      );
    }

    function formatMoney(value) {
      return Number(value || 0).toLocaleString("th-TH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
