<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Event Photos</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 min-h-screen">

  <header class="bg-black text-white p-5">
    <a href="index.html" class="text-sm text-gray-300">
      ← กลับหน้า Event
    </a>

    <h1 id="eventTitle" class="text-2xl font-bold mt-2">
      กำลังโหลด...
    </h1>
  </header>

  <main class="max-w-7xl mx-auto p-4">

    <div class="flex justify-between items-center mb-5">
      <div>
        <h2 class="text-xl font-bold text-slate-800">
          รูปภาพทั้งหมด
        </h2>

        <p id="photoCount" class="text-sm text-slate-500">
          กำลังโหลด...
        </p>
      </div>

      <a
        id="faceSearchBtn"
        href="#"
        class="bg-black text-white px-4 py-2 rounded-xl font-semibold"
      >
        ค้นหาด้วยใบหน้า
      </a>
    </div>

    <div id="loading" class="text-center py-10 text-slate-500">
      กำลังโหลดรูปภาพ...
    </div>

    <div
      id="photoGrid"
      class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"
    ></div>

  </main>

  <script src="js/config.js"></script>

  <script>

    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("event");

    const eventTitle = document.getElementById("eventTitle");
    const photoGrid = document.getElementById("photoGrid");
    const loading = document.getElementById("loading");
    const photoCount = document.getElementById("photoCount");
    const faceSearchBtn = document.getElementById("faceSearchBtn");

    async function loadEvent() {

      if (!eventId) {
        eventTitle.innerText = "ไม่พบ Event";
        return;
      }

      faceSearchBtn.href = `search-face.html?event=${eventId}`;

      // โหลดข้อมูล Event
      const { data: eventData, error: eventError } = await supabaseClient
        .from("events")
        .select("*")
        .eq("id", eventId)
        .single();

      if (eventError) {
        console.error(eventError);
        eventTitle.innerText = "โหลด Event ไม่สำเร็จ";
        return;
      }

      eventTitle.innerText = eventData.title;

      // โหลดรูปภาพ
      const { data: photos, error: photoError } = await supabaseClient
        .from("photos")
        .select("*")
        .eq("event_id", eventId)
        .eq("status", "active")
        .order("created_at", { ascending: false });

      loading.style.display = "none";

      if (photoError) {
        console.error(photoError);

        photoGrid.innerHTML = `
          <div class="col-span-full bg-red-100 text-red-700 p-4 rounded-xl">
            โหลดรูปภาพไม่สำเร็จ
          </div>
        `;

        return;
      }

      photoCount.innerText = `${photos.length} รูป`;

      if (photos.length === 0) {

        photoGrid.innerHTML = `
          <div class="col-span-full bg-white p-6 rounded-xl text-center text-slate-500">
            ยังไม่มีรูปภาพ
          </div>
        `;

        return;
      }

      photoGrid.innerHTML = photos.map(photo => `

        <div class="bg-white rounded-2xl overflow-hidden shadow">

          <div class="aspect-square bg-slate-200">

            <img
              src="${photo.preview_url || photo.watermark_url}"
              class="w-full h-full object-cover"
              loading="lazy"
            />

          </div>

          <div class="p-3">

            <div class="flex justify-between items-center">

              <div>
                <p class="font-bold text-slate-800">
                  ฿${photo.price || 0}
                </p>

                <p class="text-xs text-slate-400 truncate">
                  ${photo.filename || ""}
                </p>
              </div>

              <button
                onclick="addToCart('${photo.id}')"
                class="bg-black text-white px-3 py-2 rounded-xl text-sm"
              >
                เพิ่มลงตะกร้า
              </button>

            </div>

          </div>

        </div>

      `).join("");
    }

    function addToCart(photoId) {

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      if (!cart.includes(photoId)) {
        cart.push(photoId);
      }

      localStorage.setItem("cart", JSON.stringify(cart));

      alert("เพิ่มลงตะกร้าแล้ว");
    }

    loadEvent();

  </script>

</body>
</html>
