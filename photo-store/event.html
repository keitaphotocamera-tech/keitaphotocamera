<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

  <title>Event Photos</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script src="./js/config.js?v=new-supabase-001"></script>
  <script src="./js/app-liff.js?v=new-supabase-001"></script>

  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      padding-bottom: 86px;
    }

    .photo-card {
      -webkit-tap-highlight-color: transparent;
    }

    .watermark-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.22;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      transform: rotate(-24deg) scale(1.15);
    }

    .watermark-text {
      color: white;
      font-weight: 900;
      font-size: 22px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-slate-950 text-white min-h-screen">

  <!-- HEADER -->
  <header class="bg-slate-950 border-b border-white/10 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-start justify-between gap-4">

      <div class="min-w-0">
        <p class="text-xs text-slate-400">LINE Mini App</p>
        <h1 id="eventTitle" class="text-2xl font-black leading-tight truncate">
          Photo Store
        </h1>
        <p id="eventSubtitle" class="text-sm text-slate-400 mt-1">
          เลือกรูปภาพที่ต้องการ
        </p>
      </div>

      <div class="flex flex-col gap-2 shrink-0">
        <button
          onclick="toggleLang()"
          id="langBtn"
          class="bg-white/10 hover:bg-white/20 rounded-2xl px-4 py-2 font-bold text-sm"
        >
          🇹🇭 TH
        </button>

        <button
          onclick="toggleDarkMode()"
          id="darkBtn"
          class="bg-white/10 hover:bg-white/20 rounded-2xl px-4 py-2 font-bold text-sm"
        >
          ☀️ Light
        </button>

        <button
          onclick="goOrder()"
          id="orderBtn"
          class="bg-white text-slate-900 rounded-2xl px-4 py-2 font-bold text-sm"
        >
          ออเดอร์ของฉัน
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-5xl mx-auto px-4 py-5">

    <!-- EVENT INFO -->
    <section class="bg-white/5 border border-white/10 rounded-3xl p-4 mb-5">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p id="photoCountText" class="text-sm text-slate-300">
            กำลังโหลดรูปภาพ...
          </p>
          <p id="priceText" class="text-xs text-slate-500 mt-1"></p>
        </div>

        <button
          onclick="goFaceSearch()"
          class="bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl px-4 py-3 font-bold text-sm"
        >
          🔍 ค้นหาใบหน้า
        </button>
      </div>
    </section>

    <!-- LOADING -->
    <div id="loadingBox" class="text-center py-16 text-slate-400">
      กำลังโหลดรูปภาพ...
    </div>

    <!-- EMPTY -->
    <div id="emptyBox" class="hidden text-center py-16 text-slate-400">
      ยังไม่มีรูปภาพใน Event นี้
    </div>

    <!-- GRID -->
    <section
      id="photoGrid"
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"
    ></section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-950 border-t border-white/10">
    <div class="max-w-5xl mx-auto grid grid-cols-3 text-center">

      <button
        onclick="goHome()"
        class="py-3 text-slate-300 font-bold text-sm"
      >
        <div class="text-xl">🏠</div>
        <div>หน้าแรก</div>
      </button>

      <button
        onclick="openCart()"
        class="py-3 text-slate-300 font-bold text-sm relative"
      >
        <div class="text-xl">🛒</div>
        <div>ตะกร้า</div>
        <span
          id="cartBadge"
          class="hidden absolute top-2 right-1/2 translate-x-8 bg-red-500 text-white text-xs rounded-full min-w-[22px] h-[22px] px-1 flex items-center justify-center"
        >
          0
        </span>
      </button>

      <button
        onclick="goOrder()"
        class="py-3 text-slate-300 font-bold text-sm"
      >
        <div class="text-xl">🧾</div>
        <div>ออเดอร์</div>
      </button>

    </div>
  </nav>

  <!-- IMAGE MODAL -->
  <div
    id="imageModal"
    class="hidden fixed inset-0 bg-black/95 z-[100] items-center justify-center p-4"
  >
    <button
      onclick="closeImageModal()"
      class="absolute top-4 right-4 bg-white/10 hover:bg-white/20 text-white rounded-full w-12 h-12 text-3xl leading-none"
    >
      ×
    </button>

    <div class="relative max-w-4xl w-full">
      <div class="relative rounded-2xl overflow-hidden bg-black">
        <img
          id="modalImage"
          src=""
          class="w-full max-h-[78vh] object-contain select-none"
          draggable="false"
        />

        <div class="watermark-layer">
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
          <div class="watermark-text">KEITA PHOTO CAMERA</div>
        </div>
      </div>

      <div class="mt-4 flex gap-3">
        <button
          id="modalAddBtn"
          class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl px-4 py-3 font-bold"
        >
          เพิ่มลงตะกร้า
        </button>

        <button
          onclick="closeImageModal()"
          class="bg-white/10 hover:bg-white/20 text-white rounded-2xl px-5 py-3 font-bold"
        >
          ปิด
        </button>
      </div>
    </div>
  </div>

  <script>
    const sb = window.sb || window.supabaseClient;

    let currentLang = localStorage.getItem("lang") || "th";
    let currentEvent = null;
    let photos = [];
    let selectedPhoto = null;

    const params = new URLSearchParams(window.location.search);
    const eventId =
      params.get("event") ||
      params.get("event_id") ||
      params.get("id");

    document.addEventListener("DOMContentLoaded", async () => {
      initDarkMode();
      updateLangUI();

      try {
        if (window.AppLIFF) {
          await AppLIFF.init();
        }
      } catch (err) {
        console.warn("LIFF init skipped:", err);
      }

      if (!eventId) {
        Swal.fire("ไม่พบ Event", "กรุณาเลือก Event จากหน้าแรก", "warning")
          .then(() => goHome());
        return;
      }

      await loadEvent();
      await loadPhotos();
      updateCartBadge();
    });

    async function loadEvent() {
      const { data, error } = await sb
        .from("events")
        .select("*")
        .eq("id", eventId)
        .single();

      if (error) {
        console.error(error);
        Swal.fire("เกิดข้อผิดพลาด", error.message, "error");
        return;
      }

      currentEvent = data;

      document.getElementById("eventTitle").textContent =
        data.title || data.name || "Photo Store";

      document.getElementById("eventSubtitle").textContent =
        currentLang === "th"
          ? "เลือกรูปภาพที่ต้องการ"
          : "Choose your photos";

      const price = Number(data.price || CONFIG.DEFAULT_PHOTO_PRICE || 50);
      document.getElementById("priceText").textContent =
        currentLang === "th"
          ? `ราคาเริ่มต้น ${price} บาท / รูป`
          : `Price from ${price} THB / photo`;
    }

    async function loadPhotos() {
      const loadingBox = document.getElementById("loadingBox");
      const emptyBox = document.getElementById("emptyBox");
      const grid = document.getElementById("photoGrid");

      loadingBox.classList.remove("hidden");
      emptyBox.classList.add("hidden");
      grid.innerHTML = "";

      const { data, error } = await sb
        .from("photos")
        .select("*")
        .eq("event_id", eventId)
        .eq("status", "active")
        .order("created_at", { ascending: false });

      loadingBox.classList.add("hidden");

      if (error) {
        console.error(error);
        Swal.fire("โหลดรูปไม่สำเร็จ", error.message, "error");
        return;
      }

      photos = data || [];

      document.getElementById("photoCountText").textContent =
        currentLang === "th"
          ? `พบรูปภาพ ${photos.length} รูป`
          : `${photos.length} photos found`;

      if (!photos.length) {
        emptyBox.classList.remove("hidden");
        return;
      }

      grid.innerHTML = photos.map(photo => renderPhotoCard(photo)).join("");
      updateSelectedUI();
    }

    function renderPhotoCard(photo) {
      const imgUrl = getPhotoUrl(photo);
      const price = Number(photo.price || currentEvent?.price || CONFIG.DEFAULT_PHOTO_PRICE || 50);
      const isInCart = getCart().some(item => item.photo_id === photo.id);

      return `
        <div
          class="photo-card bg-white/5 border border-white/10 rounded-2xl overflow-hidden"
          data-photo-id="${photo.id}"
        >
          <button
            onclick="openImageModal('${photo.id}')"
            class="block w-full aspect-square bg-slate-800 overflow-hidden"
          >
            <img
              src="${escapeAttr(imgUrl)}"
              loading="lazy"
              class="w-full h-full object-cover"
              onerror="this.src='https://placehold.co/600x600/111827/ffffff?text=No+Image'"
            />
          </button>

          <div class="p-3">
            <div class="text-xs text-slate-400 truncate mb-2">
              ${escapeHtml(photo.filename || "photo")}
            </div>

            <div class="flex items-center justify-between gap-2">
              <div class="font-bold text-sm">
                ${price} ฿
              </div>

              <button
                onclick="toggleCart('${photo.id}')"
                id="cartBtn-${photo.id}"
                class="${isInCart ? "bg-red-500" : "bg-emerald-500"} text-white rounded-xl px-3 py-2 text-xs font-bold"
              >
                ${isInCart ? "ลบ" : "เลือก"}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function getPhotoUrl(photo) {
      return (
        photo.r2_watermark_url ||
        photo.r2_preview_url ||
        photo.watermark_url ||
        photo.preview_url ||
        photo.image_url ||
        ""
      );
    }

    function getCartKey() {
      if (window.AppLIFF && AppLIFF.getCartKey) {
        return AppLIFF.getCartKey();
      }

      const userId = localStorage.getItem("line_user_id") || "guest";
      return `photo_cart_${userId}`;
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem(getCartKey()) || "[]");
      } catch {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem(getCartKey(), JSON.stringify(cart));
      updateCartBadge();
      updateSelectedUI();
    }

    function toggleCart(photoId) {
      const photo = photos.find(p => p.id === photoId);
      if (!photo) return;

      const cart = getCart();
      const index = cart.findIndex(item => item.photo_id === photoId);

      if (index >= 0) {
        cart.splice(index, 1);
      } else {
        const price = Number(photo.price || currentEvent?.price || CONFIG.DEFAULT_PHOTO_PRICE || 50);

        cart.push({
          photo_id: photo.id,
          event_id: eventId,
          filename: photo.filename || "",
          photo_url: getPhotoUrl(photo),
          price: price
        });
      }

      saveCart(cart);
    }

    function updateSelectedUI() {
      const cart = getCart();

      photos.forEach(photo => {
        const btn = document.getElementById(`cartBtn-${photo.id}`);
        if (!btn) return;

        const isInCart = cart.some(item => item.photo_id === photo.id);

        btn.textContent = isInCart ? "ลบ" : "เลือก";
        btn.className =
          `${isInCart ? "bg-red-500" : "bg-emerald-500"} text-white rounded-xl px-3 py-2 text-xs font-bold`;
      });
    }

    function updateCartBadge() {
      const badge = document.getElementById("cartBadge");
      const count = getCart().length;

      badge.textContent = count;

      if (count > 0) {
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    function openCart() {
      const cart = getCart();

      if (!cart.length) {
        Swal.fire(
          currentLang === "th" ? "ตะกร้าว่าง" : "Cart is empty",
          currentLang === "th" ? "กรุณาเลือกรูปก่อน" : "Please select photos first",
          "info"
        );
        return;
      }

      window.location.href = `checkout.html?event=${encodeURIComponent(eventId)}`;
    }

    function openImageModal(photoId) {
      const photo = photos.find(p => p.id === photoId);
      if (!photo) return;

      selectedPhoto = photo;

      document.getElementById("modalImage").src = getPhotoUrl(photo);
      document.getElementById("imageModal").classList.remove("hidden");
      document.getElementById("imageModal").classList.add("flex");

      document.getElementById("modalAddBtn").onclick = () => {
        toggleCart(photo.id);
        closeImageModal();
      };

      document.body.style.overflow = "hidden";
    }

    function closeImageModal() {
      document.getElementById("imageModal").classList.add("hidden");
      document.getElementById("imageModal").classList.remove("flex");
      document.getElementById("modalImage").src = "";
      document.body.style.overflow = "";
    }

    function goHome() {
      window.location.href = "index.html";
    }

    function goOrder() {
      window.location.href = "order.html";
    }

    function goFaceSearch() {
      window.location.href = `face-search.html?event=${encodeURIComponent(eventId)}`;
    }

    function toggleLang() {
      currentLang = currentLang === "th" ? "en" : "th";
      localStorage.setItem("lang", currentLang);
      updateLangUI();

      if (currentEvent) {
        document.getElementById("eventSubtitle").textContent =
          currentLang === "th"
            ? "เลือกรูปภาพที่ต้องการ"
            : "Choose your photos";

        const price = Number(currentEvent.price || CONFIG.DEFAULT_PHOTO_PRICE || 50);
        document.getElementById("priceText").textContent =
          currentLang === "th"
            ? `ราคาเริ่มต้น ${price} บาท / รูป`
            : `Price from ${price} THB / photo`;

        document.getElementById("photoCountText").textContent =
          currentLang === "th"
            ? `พบรูปภาพ ${photos.length} รูป`
            : `${photos.length} photos found`;
      }
    }

    function updateLangUI() {
      const btn = document.getElementById("langBtn");
      btn.textContent = currentLang === "th" ? "🇹🇭 TH" : "🇬🇧 EN";
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle("dark");

      const isDark = html.classList.contains("dark");
      localStorage.setItem("darkMode", isDark ? "1" : "0");

      updateDarkButton();
    }

    function updateDarkButton() {
      const btn = document.getElementById("darkBtn");
      const isDark = document.documentElement.classList.contains("dark");
      btn.innerHTML = isDark ? "☀️ Light" : "🌙 Dark";
    }

    function initDarkMode() {
      const saved = localStorage.getItem("darkMode");

      if (saved === "1") {
        document.documentElement.classList.add("dark");
      }

      updateDarkButton();
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(text) {
      return escapeHtml(text);
    }

    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("dragstart", e => {
      if (e.target.tagName === "IMG") e.preventDefault();
    });
  </script>

</body>
</html>
