<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ดาวน์โหลดภาพ</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js"></script>
  <script src="js/liff-helper.js"></script>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-white transition">

  <main class="max-w-5xl mx-auto p-4 pb-24">

    <header class="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition">

      <div class="flex justify-between gap-3">

        <div>

          <p
            id="txtMiniApp"
            class="text-xs text-slate-500 dark:text-slate-400"
          >
            LINE Mini App
          </p>

          <h1
            id="txtPageTitle"
            class="text-xl font-bold"
          >
            ดาวน์โหลดภาพ
          </h1>

          <p
            id="orderText"
            class="text-sm text-slate-500 dark:text-slate-400"
          >
            กำลังโหลดข้อมูล...
          </p>

        </div>

        <div class="flex flex-col sm:flex-row gap-2">

          <button
            onclick="goOrder()"
            class="bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-full px-4 py-2 font-bold"
          >
            <span id="txtOrderBtn">ออเดอร์</span>
          </button>

          <select
            id="langSelect"
            onchange="changeLanguage(this.value)"
            class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-3 py-2 text-sm font-bold outline-none"
          >
            <option value="th">🇹🇭 TH</option>
            <option value="en">🇺🇸 EN</option>
            <option value="ru">🇷🇺 RU</option>
          </select>

          <button
            onclick="toggleDarkMode()"
            id="darkBtn"
            class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-4 py-2 text-sm font-bold"
          >
            🌙 Dark
          </button>

        </div>

      </div>

    </header>

    <section
      id="downloadAllBox"
      class="hidden bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition"
    >
      <button
        onclick="downloadAllFiles()"
        class="w-full bg-emerald-600 text-white rounded-2xl py-3 font-bold"
      >
        ⬇️ <span id="txtDownloadAll">ดาวน์โหลดรูปทั้งหมด</span>
      </button>

      <p
        id="txtDownloadAllHint"
        class="mt-3 text-center text-xs text-slate-500 dark:text-slate-400"
      >
        ระบบจะเปิดรูปในหน้าใหม่ เพื่อให้กดบันทึกได้สะดวก
      </p>
    </section>

    <section
      id="loadingBox"
      class="text-center py-10 text-slate-500 dark:text-slate-400"
    >
      กำลังโหลดภาพ...
    </section>

    <section
      id="photoGrid"
      class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"
    ></section>

    <section
      id="blockedBox"
      class="hidden text-center py-16"
    >

      <p class="text-5xl">🔒</p>

      <h2
        id="txtBlockedTitle"
        class="mt-3 text-lg font-bold"
      >
        ยังไม่สามารถดาวน์โหลดได้
      </h2>

      <p
        id="txtBlockedDesc"
        class="text-sm text-slate-500 dark:text-slate-400 mt-1"
      >
        กรุณารอแอดมินอนุมัติคำสั่งซื้อก่อน
      </p>

      <button
        onclick="goOrder()"
        class="mt-5 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl px-5 py-3 font-bold"
      >
        <span id="txtBackOrder">กลับไปหน้าออเดอร์</span>
      </button>

    </section>

  </main>

  <script>

    const db =
      window.sb ||
      window.supabaseClient;

    let profile = null;
    let orderId = null;
    let order = null;

    /****************************************
     * LANGUAGE
     ****************************************/

    const LANG = {

      th: {
        miniApp: "LINE Mini App",
        pageTitle: "ดาวน์โหลดภาพ",
        loading: "กำลังโหลดข้อมูล...",
        loadingPhoto: "กำลังโหลดภาพ...",
        orderBtn: "ออเดอร์",
        blockedTitle: "ยังไม่สามารถดาวน์โหลดได้",
        blockedDesc: "กรุณารอแอดมินอนุมัติคำสั่งซื้อก่อน",
        backOrder: "กลับไปหน้าออเดอร์",
        noPhoto: "ไม่พบรายการภาพใน Order นี้",
        downloadReady: "ดาวน์โหลดภาพที่อนุมัติแล้ว",
        downloadBtn: "ดาวน์โหลด",
        downloadAll: "ดาวน์โหลดรูปทั้งหมด",
        downloadAllHint: "ระบบจะเปิดรูปในหน้าใหม่ เพื่อให้กดบันทึกได้สะดวก",
        downloadAllTitle: "ดาวน์โหลดทั้งหมด",
        downloadAllText: "ระบบจะเปิดรูปทั้งหมดในหน้าใหม่ หากมือถือบล็อก ให้กดอนุญาตเปิดหลายหน้า",
        startDownload: "เริ่มดาวน์โหลด",
        cancel: "ยกเลิก",
        noFile: "ไม่พบไฟล์",
        noFileDesc: "ยังไม่มี URL สำหรับดาวน์โหลด",
        errorTitle: "เกิดข้อผิดพลาด"
      },

      en: {
        miniApp: "LINE Mini App",
        pageTitle: "Download Photos",
        loading: "Loading data...",
        loadingPhoto: "Loading photos...",
        orderBtn: "Orders",
        blockedTitle: "Download Not Available Yet",
        blockedDesc: "Please wait for admin approval before downloading",
        backOrder: "Back to Orders",
        noPhoto: "No photos found in this order",
        downloadReady: "Approved photo download",
        downloadBtn: "Download",
        downloadAll: "Download All Photos",
        downloadAllHint: "Photos will open in a new page so you can save them easily",
        downloadAllTitle: "Download All",
        downloadAllText: "All photos will open in new pages. If your phone blocks popups, please allow multiple pages.",
        startDownload: "Start Download",
        cancel: "Cancel",
        noFile: "File Not Found",
        noFileDesc: "No download URL available",
        errorTitle: "Error"
      },

      ru: {
        miniApp: "LINE Мини-приложение",
        pageTitle: "Скачать Фото",
        loading: "Загрузка данных...",
        loadingPhoto: "Загрузка фотографий...",
        orderBtn: "Заказы",
        blockedTitle: "Скачивание пока недоступно",
        blockedDesc: "Пожалуйста, дождитесь подтверждения администратора",
        backOrder: "Назад к заказам",
        noPhoto: "В этом заказе нет фотографий",
        downloadReady: "Скачать одобренные фотографии",
        downloadBtn: "Скачать",
        downloadAll: "Скачать все фото",
        downloadAllHint: "Фотографии откроются в новой странице для удобного сохранения",
        downloadAllTitle: "Скачать все",
        downloadAllText: "Все фотографии откроются в новых страницах. Если телефон блокирует окна, разрешите открытие нескольких страниц.",
        startDownload: "Начать скачивание",
        cancel: "Отмена",
        noFile: "Файл не найден",
        noFileDesc: "URL для скачивания отсутствует",
        errorTitle: "Ошибка"
      }

    };

    let currentLang =
      localStorage.getItem("lang") || "th";

    function t() {
      return LANG[currentLang];
    }

    function applyLanguage() {

      const x = t();

      document.documentElement.lang =
        currentLang;

      document.getElementById("txtMiniApp").textContent =
        x.miniApp;

      document.getElementById("txtPageTitle").textContent =
        x.pageTitle;

      document.getElementById("loadingBox").textContent =
        x.loadingPhoto;

      document.getElementById("txtOrderBtn").textContent =
        x.orderBtn;

      document.getElementById("txtBlockedTitle").textContent =
        x.blockedTitle;

      document.getElementById("txtBlockedDesc").textContent =
        x.blockedDesc;

      document.getElementById("txtBackOrder").textContent =
        x.backOrder;

      document.getElementById("txtDownloadAll").textContent =
        x.downloadAll;

      document.getElementById("txtDownloadAllHint").textContent =
        x.downloadAllHint;

      document.getElementById("langSelect").value =
        currentLang;
    }

    function changeLanguage(lang) {

      currentLang = lang;

      localStorage.setItem(
        "lang",
        lang
      );

      applyLanguage();

      if (order) {
        renderPhotos();
      }
    }

    /****************************************
     * INIT
     ****************************************/

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        try {

          initDarkMode();

          applyLanguage();

          if (!db) {

            throw new Error(
              "ไม่พบ Supabase client"
            );
          }

          profile =
            await AppLIFF.init();

          if (!profile) return;

          orderId =
            getOrderId();

          if (!orderId) {

            throw new Error(
              "ไม่พบ order_id"
            );
          }

          await loadOrder();

        } catch (err) {

          console.error(err);

          document
            .getElementById("loadingBox")
            .classList.add("hidden");

          Swal.fire(
            t().errorTitle,
            err.message || "โหลดข้อมูลไม่สำเร็จ",
            "error"
          );
        }
      }
    );

    function getOrderId() {

      const params =
        new URLSearchParams(window.location.search);

      return (
        params.get("order_id") ||
        params.get("id")
      );
    }

    async function loadOrder() {

      const { data, error } =
        await db
          .from("orders")
          .select(`
            *,
            order_items (
              id,
              photo_id,
              price,
              photos (
                id,
                filename,
                preview_url,
                watermark_url
              )
            )
          `)
          .eq("id", orderId)
          .eq(
            "line_user_id",
            profile.userId
          )
          .single();

      if (error) throw error;

      order = data;

      document
        .getElementById("loadingBox")
        .classList.add("hidden");

      document.getElementById("orderText").textContent =
        `Order: ${order.order_no || order.id}`;

      if (order.status !== "paid") {

        document
          .getElementById("blockedBox")
          .classList.remove("hidden");

        return;
      }

      document
        .getElementById("downloadAllBox")
        .classList.remove("hidden");

      renderPhotos();
    }

    function renderPhotos() {

      const grid =
        document.getElementById("photoGrid");

      const items =
        order.order_items || [];

      grid.innerHTML = "";

      if (!items.length) {

        grid.innerHTML = `
          <div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">
            ${t().noPhoto}
          </div>
        `;

        grid.classList.remove("hidden");

        return;
      }

      items.forEach(item => {

        const photo =
          item.photos || {};

        const preview =
          photo.watermark_url ||
          photo.preview_url ||
          "https://placehold.co/600x800?text=Photo";

        const downloadUrl =
          photo.preview_url ||
          photo.watermark_url ||
          "";

        const card =
          document.createElement("article");

        card.className =
          "bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow-sm transition";

        card.innerHTML = `
          <img
            src="${preview}"
            class="w-full aspect-[3/4] object-cover bg-slate-200 dark:bg-slate-800"
          />

          <div class="p-4">

            <p class="font-bold truncate">
              ${escapeHtml(photo.filename || item.photo_id)}
            </p>

            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
              ${t().downloadReady}
            </p>

            <button
              onclick="downloadFile('${escapeAttr(downloadUrl)}', '${escapeAttr(photo.filename || item.photo_id)}')"
              class="mt-4 w-full bg-emerald-600 text-white rounded-2xl py-3 font-bold disabled:opacity-40"
              ${downloadUrl ? "" : "disabled"}
            >
              ${t().downloadBtn}
            </button>

          </div>
        `;

        grid.appendChild(card);

      });

      grid.classList.remove("hidden");
    }

    function downloadFile(url, filename) {

      if (!url) {

        Swal.fire(
          t().noFile,
          t().noFileDesc,
          "warning"
        );

        return;
      }

      openDownloadWindow(url);
    }

    function openDownloadWindow(url) {

      if (
        window.liff &&
        liff.isInClient()
      ) {

        liff.openWindow({
          url: url,
          external: true
        });

        return;
      }

      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );
    }

    async function downloadAllFiles() {

      if (
        !order ||
        order.status !== "paid"
      ) {

        Swal.fire(
          t().blockedTitle,
          t().blockedDesc,
          "warning"
        );

        return;
      }

      const items =
        order.order_items || [];

      const urls =
        items
          .map(item => {

            const photo =
              item.photos || {};

            return (
              photo.preview_url ||
              photo.watermark_url ||
              ""
            );
          })
          .filter(Boolean);

      if (!urls.length) {

        Swal.fire(
          t().noFile,
          t().noFileDesc,
          "warning"
        );

        return;
      }

      const confirm =
        await Swal.fire({
          icon: "info",
          title: t().downloadAllTitle,
          html: `
            <div style="text-align:left">
              <p>${t().downloadAllText}</p>
              <p style="margin-top:8px;color:#64748b">
                จำนวน ${urls.length} รูป
              </p>
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: t().startDownload,
          cancelButtonText: t().cancel
        });

      if (!confirm.isConfirmed) return;

      urls.forEach((url, index) => {

        setTimeout(() => {

          openDownloadWindow(url);

        }, index * 600);
      });
    }

    function goOrder() {

      window.location.href =
        "order.html";
    }

    /****************************************
     * DARK MODE
     ****************************************/

    function toggleDarkMode() {

      const html =
        document.documentElement;

      html.classList.toggle("dark");

      const isDark =
        html.classList.contains("dark");

      localStorage.setItem(
        "darkMode",
        isDark ? "1" : "0"
      );

      updateDarkButton();
    }

    function updateDarkButton() {

      const btn =
        document.getElementById("darkBtn");

      if (!btn) return;

      const isDark =
        document.documentElement
          .classList
          .contains("dark");

      btn.innerHTML =
        isDark
          ? "☀️ Light"
          : "🌙 Dark";
    }

    function initDarkMode() {

      const saved =
        localStorage.getItem("darkMode");

      if (saved === "1") {

        document.documentElement
          .classList.add("dark");
      }

      updateDarkButton();
    }

    function escapeHtml(text) {

      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(text) {

      return escapeHtml(text)
        .replace(/`/g, "&#096;");
    }

  </script>

</body>
</html>
