<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ดาวน์โหลดภาพ</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js"></script>
  <script src="js/liff-helper.js"></script>
</head>

<body class="bg-slate-100 text-slate-800">
  <main class="max-w-5xl mx-auto p-4 pb-24">

    <header class="bg-white rounded-3xl p-4 shadow-sm mb-4">
      <div class="flex justify-between gap-3">
        <div>
          <p class="text-xs text-slate-500">LINE Mini App</p>
          <h1 class="text-xl font-bold">ดาวน์โหลดภาพ</h1>
          <p id="orderText" class="text-sm text-slate-500">กำลังโหลดข้อมูล...</p>
        </div>

        <button onclick="goOrder()" class="bg-slate-900 text-white rounded-full px-4 py-2 font-bold">
          ออเดอร์
        </button>
      </div>
    </header>

    <section id="loadingBox" class="text-center py-10 text-slate-500">
      กำลังโหลดภาพ...
    </section>

    <section id="photoGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></section>

    <section id="blockedBox" class="hidden text-center py-16">
      <p class="text-5xl">🔒</p>
      <h2 class="mt-3 text-lg font-bold">ยังไม่สามารถดาวน์โหลดได้</h2>
      <p class="text-sm text-slate-500 mt-1">กรุณารอแอดมินอนุมัติคำสั่งซื้อก่อน</p>
      <button onclick="goOrder()" class="mt-5 bg-slate-900 text-white rounded-2xl px-5 py-3 font-bold">
        กลับไปหน้าออเดอร์
      </button>
    </section>

  </main>

  <script>
    const db = window.sb || window.supabaseClient;

    let profile = null;
    let orderId = null;
    let order = null;

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        if (!db) throw new Error("ไม่พบ Supabase client");

        profile = await AppLIFF.init();
        if (!profile) return;

        orderId = getOrderId();

        if (!orderId) {
          throw new Error("ไม่พบ order_id");
        }

        await loadOrder();

      } catch (err) {
        console.error(err);
        document.getElementById("loadingBox").classList.add("hidden");
        Swal.fire("เกิดข้อผิดพลาด", err.message || "โหลดข้อมูลไม่สำเร็จ", "error");
      }
    });

    function getOrderId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("order_id") || params.get("id");
    }

    async function loadOrder() {
      const { data, error } = await db
        .from("orders")
        .select(`
          *,
          order_items (
            id,
            photo_id,
            price,
            photos (
              id,
              filename,
              preview_url,
              watermark_url
            )
          )
        `)
        .eq("id", orderId)
        .eq("line_user_id", profile.userId)
        .single();

      if (error) throw error;

      order = data;

      document.getElementById("loadingBox").classList.add("hidden");
      document.getElementById("orderText").textContent =
        `Order: ${order.order_no || order.id}`;

      if (order.status !== "paid") {
        document.getElementById("blockedBox").classList.remove("hidden");
        return;
      }

      renderPhotos();
    }

    function renderPhotos() {
      const grid = document.getElementById("photoGrid");
      const items = order.order_items || [];

      grid.innerHTML = "";

      if (!items.length) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-10 text-slate-500">
            ไม่พบรายการภาพใน Order นี้
          </div>
        `;
        grid.classList.remove("hidden");
        return;
      }

      items.forEach(item => {
        const photo = item.photos || {};
        const preview =
          photo.watermark_url ||
          photo.preview_url ||
          "https://placehold.co/600x800?text=Photo";

        const downloadUrl =
          photo.preview_url ||
          photo.watermark_url ||
          "";

        const card = document.createElement("article");
        card.className = "bg-white rounded-3xl overflow-hidden shadow-sm";

        card.innerHTML = `
          <img src="${preview}" class="w-full aspect-[3/4] object-cover bg-slate-200" />

          <div class="p-4">
            <p class="font-bold truncate">${escapeHtml(photo.filename || item.photo_id)}</p>
            <p class="text-xs text-slate-500 mt-1">ดาวน์โหลดภาพที่อนุมัติแล้ว</p>

            <button
              onclick="downloadFile('${escapeAttr(downloadUrl)}', '${escapeAttr(photo.filename || item.photo_id)}')"
              class="mt-4 w-full bg-emerald-600 text-white rounded-2xl py-3 font-bold"
              ${downloadUrl ? "" : "disabled"}
            >
              ดาวน์โหลด
            </button>
          </div>
        `;

        grid.appendChild(card);
      });

      grid.classList.remove("hidden");
    }

    // function downloadFile(url, filename) {
    //   if (!url) {
    //     Swal.fire("ไม่พบไฟล์", "ยังไม่มี URL สำหรับดาวน์โหลด", "warning");
    //     return;
    //   }

    //   const a = document.createElement("a");
    //   a.href = url;
    //   a.target = "_blank";
    //   a.download = filename || "photo";
    //   document.body.appendChild(a);
    //   a.click();
    //   a.remove();
    // }
    async function downloadFile(url, filename) {
  if (!url) {
    Swal.fire("ไม่พบไฟล์", "ยังไม่มี URL สำหรับดาวน์โหลด", "warning");
    return;
  }

  try {
    Swal.fire({
      title: "กำลังเตรียมดาวน์โหลด...",
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("โหลดไฟล์ไม่สำเร็จ");
    }

    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);

    const safeName = filename || `photo-${Date.now()}.jpg`;

    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = safeName;
    a.style.display = "none";

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(blobUrl);

    Swal.close();

  } catch (err) {
    console.error(err);

    Swal.fire({
      icon: "info",
      title: "เปิดภาพเพื่อบันทึก",
      html: `
        <p style="margin-bottom:10px">
          หากเปิดผ่าน LINE หรือ iPhone ให้กดค้างที่ภาพแล้วเลือกบันทึกภาพ
        </p>
        <a href="${url}" target="_blank" style="color:#2563eb;font-weight:bold">
          เปิดภาพต้นฉบับ
        </a>
      `,
      confirmButtonText: "ตกลง"
    });
  }
}

    function goOrder() {
      window.location.href = "order.html";
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/`/g, "&#096;");
    }
  </script>
</body>
</html>
