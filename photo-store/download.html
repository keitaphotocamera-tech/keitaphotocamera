<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download Photos - KEITA PHOTO</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<header class="bg-black text-white p-5">
  <a href="index.html" class="text-sm text-gray-300">← กลับหน้า Event</a>
  <h1 class="text-2xl font-bold mt-2">ดาวน์โหลดรูปภาพ</h1>
</header>

<main class="max-w-4xl mx-auto p-4">

  <div class="bg-white rounded-2xl shadow p-5 mb-5">
    <h2 class="text-xl font-bold mb-3">ค้นหาคำสั่งซื้อ</h2>

    <input
      id="orderNo"
      type="text"
      placeholder="ใส่เลขคำสั่งซื้อ เช่น ORD-20260516-XXXX"
      class="w-full border rounded-xl p-3 mb-3"
    />

    <button
      onclick="searchOrder()"
      class="w-full bg-black text-white py-3 rounded-xl font-semibold"
    >
      ค้นหา
    </button>

    <div id="statusBox" class="mt-4 text-sm"></div>
  </div>

  <div id="downloadGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>

</main>

<script src="js/config.js"></script>

<script>
  const orderNoInput = document.getElementById("orderNo");
  const statusBox = document.getElementById("statusBox");
  const downloadGrid = document.getElementById("downloadGrid");

  async function searchOrder() {
    const orderNo = orderNoInput.value.trim();

    if (!orderNo) {
      alert("กรุณาใส่เลขคำสั่งซื้อ");
      return;
    }

    statusBox.innerHTML = "กำลังค้นหา...";
    downloadGrid.innerHTML = "";

    const { data: order, error } = await supabaseClient
      .from("orders")
      .select(`
        id,
        order_no,
        status,
        total_amount,
        order_items (
          id,
          price,
          photos (
            id,
            filename,
            preview_url,
            watermark_url,
            original_url,
            original_path
          )
        )
      `)
      .eq("order_no", orderNo)
      .single();

    if (error || !order) {
      statusBox.innerHTML = `
        <div class="bg-red-100 text-red-700 p-3 rounded-xl">
          ไม่พบคำสั่งซื้อ
        </div>
      `;
      return;
    }

    if (order.status !== "approved") {
      statusBox.innerHTML = `
        <div class="bg-yellow-100 text-yellow-700 p-3 rounded-xl">
          คำสั่งซื้อนี้ยังไม่ผ่านการอนุมัติ สถานะปัจจุบัน: ${order.status}
        </div>
      `;
      return;
    }

    statusBox.innerHTML = `
      <div class="bg-green-100 text-green-700 p-3 rounded-xl">
        อนุมัติแล้ว สามารถดาวน์โหลดรูปได้
      </div>
    `;

    const items = order.order_items || [];

    downloadGrid.innerHTML = items.map(item => {
      const photo = item.photos;
      const downloadUrl = photo.original_url || photo.preview_url || photo.watermark_url;

      return `
        <div class="bg-white rounded-2xl shadow overflow-hidden">
          <img
            src="${photo.preview_url || photo.watermark_url}"
            class="w-full aspect-square object-cover bg-slate-200"
          />

          <div class="p-3">
            <p class="text-sm font-semibold truncate">${photo.filename || "Photo"}</p>

            <a
              href="${downloadUrl}"
              target="_blank"
              download
              class="block mt-3 bg-black text-white text-center py-2 rounded-xl text-sm font-semibold"
            >
              ดาวน์โหลด
            </a>
          </div>
        </div>
      `;
    }).join("");
  }
</script>

</body>
</html>
