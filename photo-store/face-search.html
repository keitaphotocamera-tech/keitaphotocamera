<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ค้นหาภาพด้วยใบหน้า</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/liff-helper.js"></script>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-white transition">

  <main class="max-w-5xl mx-auto p-4 pb-28">

    <header class="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition">

      <div class="flex justify-between items-start gap-3">

        <div>

          <p id="txtMiniApp" class="text-xs text-slate-500 dark:text-slate-400">
            LINE Mini App
          </p>

          <h1 id="txtPageTitle" class="text-2xl font-bold">
            ค้นหาภาพด้วยใบหน้า
          </h1>

          <p id="eventText" class="text-sm text-slate-500 dark:text-slate-400 mt-1">
            กำลังโหลดข้อมูล...
          </p>

        </div>

        <div class="flex flex-col sm:flex-row gap-2">

          <button
            onclick="goEvent()"
            class="bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-full px-4 py-2 font-bold"
          >
            ← <span id="txtBack">กลับ</span>
          </button>

          <select
            id="langSelect"
            onchange="changeLanguage(this.value)"
            class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-3 py-2 text-sm font-bold outline-none"
          >
            <option value="th">🇹🇭 TH</option>
            <option value="en">🇺🇸 EN</option>
            <option value="ru">🇷🇺 RU</option>
          </select>

          <button
            onclick="toggleDarkMode()"
            id="darkBtn"
            class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-4 py-2 text-sm font-bold"
          >
            🌙 Dark
          </button>

        </div>

      </div>

    </header>

    <section class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm mb-4 transition">

      <h2 id="txtUploadTitle" class="font-bold text-lg">
        อัปโหลดรูปใบหน้า
      </h2>

      <p id="txtUploadDesc" class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        กรุณาใช้รูปที่เห็นใบหน้าชัดเจน
      </p>

      <input
        id="faceInput"
        type="file"
        accept="image/*"
        class="mt-4 w-full bg-slate-50 dark:bg-slate-800 rounded-2xl p-4"
      />

      <img
        id="previewImage"
        class="hidden mt-4 rounded-2xl w-full max-h-[420px] object-contain bg-slate-100 dark:bg-slate-800"
      />

      <button
        id="searchBtn"
        onclick="searchByFace()"
        disabled
        class="mt-4 w-full bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl py-3 font-bold disabled:opacity-40"
      >
        ค้นหาภาพของฉัน
      </button>

    </section>

    <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition">

      <div class="flex justify-between items-center">

        <div>

          <p id="txtSearchResult" class="text-xs text-slate-500 dark:text-slate-400">
            ผลการค้นหา
          </p>

          <p class="font-bold">
            <span id="resultCount">0</span>
            <span id="txtPhotoUnit">ภาพ</span>
          </p>

        </div>

        <button
          onclick="goCart()"
          class="bg-emerald-600 text-white rounded-2xl px-4 py-3 font-bold"
        >
          <span id="txtGoCart">ไปตะกร้า</span>
        </button>

      </div>

    </section>

    <section
      id="resultGrid"
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"
    ></section>

    <section
      id="emptyBox"
      class="hidden text-center py-16"
    >

      <p class="text-5xl">🙂</p>

      <h2 id="txtNoResult" class="mt-3 text-lg font-bold">
        ยังไม่พบภาพ
      </h2>

      <p id="txtNoResultDesc" class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        ลองใช้รูปหน้าที่ชัดขึ้น
      </p>

    </section>

  </main>

  <script>

    const db =
      window.sb ||
      window.supabaseClient;

    let profile = null;
    let eventId = null;
    let eventData = null;
    let selectedFile = null;
    let results = [];

    /****************************************
     * LANGUAGE
     ****************************************/

    const LANG = {

      th: {
        miniApp: "LINE Mini App",
        pageTitle: "ค้นหาภาพด้วยใบหน้า",
        back: "กลับ",
        uploadTitle: "อัปโหลดรูปใบหน้า",
        uploadDesc: "กรุณาใช้รูปที่เห็นใบหน้าชัดเจน",
        searchBtn: "ค้นหาภาพของฉัน",
        searchResult: "ผลการค้นหา",
        photoUnit: "ภาพ",
        goCart: "ไปตะกร้า",
        noResult: "ยังไม่พบภาพ",
        noResultDesc: "ลองใช้รูปหน้าที่ชัดขึ้น",
        loadingFace: "กำลังวิเคราะห์ใบหน้า...",
        loadingSearch: "กำลังค้นหารูป...",
        loadingSystem: "กำลังโหลดระบบค้นหาใบหน้า...",
        noFace: "ไม่พบใบหน้า",
        noFaceDesc: "กรุณาใช้รูปที่เห็นใบหน้าชัดเจน",
        addSuccess: "เพิ่มลงตะกร้าแล้ว",
        goCartConfirm: "ไปตะกร้า",
        continueSelect: "เลือกต่อ",
        similarity: "ความใกล้เคียง"
      },

      en: {
        miniApp: "LINE Mini App",
        pageTitle: "Face Search",
        back: "Back",
        uploadTitle: "Upload Face Photo",
        uploadDesc: "Please use a clear face photo",
        searchBtn: "Search My Photos",
        searchResult: "Search Results",
        photoUnit: "photos",
        goCart: "Go to Cart",
        noResult: "No Photos Found",
        noResultDesc: "Try using a clearer face image",
        loadingFace: "Analyzing face...",
        loadingSearch: "Searching photos...",
        loadingSystem: "Loading face search system...",
        noFace: "Face not found",
        noFaceDesc: "Please use a clearer face photo",
        addSuccess: "Added to cart",
        goCartConfirm: "Go to Cart",
        continueSelect: "Continue",
        similarity: "Similarity"
      },

      ru: {
        miniApp: "LINE Мини-приложение",
        pageTitle: "Поиск по лицу",
        back: "Назад",
        uploadTitle: "Загрузить фото лица",
        uploadDesc: "Пожалуйста, используйте чёткое фото лица",
        searchBtn: "Найти мои фото",
        searchResult: "Результаты поиска",
        photoUnit: "фото",
        goCart: "В корзину",
        noResult: "Фото не найдены",
        noResultDesc: "Попробуйте использовать более чёткое фото",
        loadingFace: "Анализ лица...",
        loadingSearch: "Поиск фотографий...",
        loadingSystem: "Загрузка системы поиска...",
        noFace: "Лицо не найдено",
        noFaceDesc: "Пожалуйста, используйте более чёткое фото",
        addSuccess: "Добавлено в корзину",
        goCartConfirm: "В корзину",
        continueSelect: "Продолжить",
        similarity: "Схожесть"
      }

    };

    let currentLang =
      localStorage.getItem("lang") || "th";

    function t() {
      return LANG[currentLang];
    }

    function applyLanguage() {

      const x = t();

      document.documentElement.lang =
        currentLang;

      document.getElementById("txtMiniApp").textContent =
        x.miniApp;

      document.getElementById("txtPageTitle").textContent =
        x.pageTitle;

      document.getElementById("txtBack").textContent =
        x.back;

      document.getElementById("txtUploadTitle").textContent =
        x.uploadTitle;

      document.getElementById("txtUploadDesc").textContent =
        x.uploadDesc;

      document.getElementById("searchBtn").textContent =
        x.searchBtn;

      document.getElementById("txtSearchResult").textContent =
        x.searchResult;

      document.getElementById("txtPhotoUnit").textContent =
        x.photoUnit;

      document.getElementById("txtGoCart").textContent =
        x.goCart;

      document.getElementById("txtNoResult").textContent =
        x.noResult;

      document.getElementById("txtNoResultDesc").textContent =
        x.noResultDesc;

      document.getElementById("langSelect").value =
        currentLang;
    }

    function changeLanguage(lang) {

      currentLang = lang;

      localStorage.setItem(
        "lang",
        lang
      );

      applyLanguage();

      renderResults();
    }

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        try {

          initDarkMode();
          applyLanguage();

          if (!db) {
            throw new Error("ไม่พบ Supabase client");
          }

          eventId = getEventId();

          if (!eventId) {
            throw new Error("ไม่พบ event id");
          }

          profile = await AppLIFF.init();

          if (!profile) return;

          await loadModels();
          await loadEvent();

          document
            .getElementById("faceInput")
            .addEventListener("change", handleFile);

        } catch (err) {

          console.error(err);

          Swal.fire(
            "Error",
            err.message || "เปิดหน้าไม่สำเร็จ",
            "error"
          );
        }
      }
    );

    function getEventId() {

      const params =
        new URLSearchParams(window.location.search);

      return (
        params.get("event") ||
        params.get("event_id") ||
        params.get("id")
      );
    }

    async function loadModels() {

      Swal.fire({
        title: t().loadingSystem,
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      const MODEL_URL =
        "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

      await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);

      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);

      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

      Swal.close();
    }

    async function loadEvent() {

      const { data, error } =
        await db
          .from("events")
          .select("*")
          .eq("id", eventId)
          .single();

      if (error) throw error;

      eventData = data;

      document.getElementById("eventText").textContent =
        data.name ||
        data.title ||
        "Face Search";
    }

    function handleFile(e) {

      const file = e.target.files[0];

      if (!file) return;

      selectedFile = file;

      const img =
        document.getElementById("previewImage");

      img.src = URL.createObjectURL(file);

      img.classList.remove("hidden");

      document.getElementById("searchBtn").disabled = false;
    }

    async function searchByFace() {

      try {

        if (!selectedFile) {

          Swal.fire(
            "Warning",
            "",
            "warning"
          );

          return;
        }

        Swal.fire({
          title: t().loadingFace,
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        const img =
          await faceapi.bufferToImage(selectedFile);

        const options =
          new faceapi.SsdMobilenetv1Options({
            minConfidence: 0.2
          });

        const detection =
          await faceapi
            .detectSingleFace(img, options)
            .withFaceLandmarks()
            .withFaceDescriptor();

        if (!detection) {

          Swal.fire(
            t().noFace,
            t().noFaceDesc,
            "warning"
          );

          return;
        }

        const descriptor =
          Array.from(detection.descriptor);

        Swal.update({
          title: t().loadingSearch
        });

        const res =
          await fetch(
            `${CONFIG.SUPABASE_URL}/functions/v1/search-face`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                event_id: eventId,
                descriptor,
                threshold: 0.45,
                max_results: 24,
                gap_limit: 0.08
              })
            }
          );

        const data =
          await res.json();

        if (!res.ok || !data.success) {

          throw new Error(
            data.error || "ค้นหาไม่สำเร็จ"
          );
        }

        results = data.results || [];

        Swal.close();

        renderResults();

      } catch (err) {

        console.error(err);

        Swal.fire(
          "Error",
          err.message || "ค้นหาไม่สำเร็จ",
          "error"
        );
      }
    }

    function renderResults() {

      const grid =
        document.getElementById("resultGrid");

      const empty =
        document.getElementById("emptyBox");

      grid.innerHTML = "";

      document.getElementById("resultCount").textContent =
        results.length;

      if (!results.length) {

        empty.classList.remove("hidden");

        return;
      }

      empty.classList.add("hidden");

      results.forEach(item => {

        const photo =
          item.photo || {};

        const img =
          photo.watermark_url ||
          photo.preview_url ||
          "https://placehold.co/600x800?text=Photo";

        const price =
          Number(
            photo.price ||
            eventData?.photo_price ||
            CONFIG.DEFAULT_PHOTO_PRICE ||
            0
          );

        const card =
          document.createElement("article");

        card.className =
          "bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow-sm transition";

        card.innerHTML = `
          <img
            src="${img}"
            class="w-full aspect-[3/4] object-cover bg-slate-200 dark:bg-slate-800"
          >

          <div class="p-3">

            <p class="font-bold truncate text-sm">
              ${escapeHtml(photo.filename || photo.id)}
            </p>

            <p class="text-xs text-slate-500 dark:text-slate-400">
              ${t().similarity} :
              ${formatConfidence(item.confidence, item.distance)}
            </p>

            <p class="mt-1 font-bold text-emerald-600">
              ฿${formatMoney(price)}
            </p>

            <button
              onclick="addToCart('${photo.id}')"
              class="mt-3 w-full bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl py-3 font-bold text-sm"
            >
              ${t().goCart}
            </button>

          </div>
        `;

        grid.appendChild(card);

      });
    }

    function formatConfidence(confidence, distance) {

      if (
        confidence !== undefined &&
        confidence !== null
      ) {
        return `${Math.round(Number(confidence))}%`;
      }

      if (
        distance !== undefined &&
        distance !== null
      ) {
        return `ระยะ ${Number(distance).toFixed(3)}`;
      }

      return "-";
    }

    function addToCart(photoId) {

      const item =
        results.find(
          r => String(r.photo?.id) === String(photoId)
        );

      if (!item) return;

      const photo = item.photo;

      const price =
        Number(
          photo.price ||
          eventData?.photo_price ||
          CONFIG.DEFAULT_PHOTO_PRICE ||
          0
        );

      const cartKey =
        AppLIFF.getCartKey();

      const oldCart =
        JSON.parse(
          localStorage.getItem(cartKey) || "[]"
        );

      const map =
        new Map(
          oldCart.map(i => [String(i.photo_id), i])
        );

      map.set(
        String(photo.id),
        {
          event_id: eventId,
          event_name:
            eventData?.name ||
            eventData?.title ||
            "",

          photo_id: photo.id,

          filename:
            photo.filename || "",

          file_name:
            photo.filename || "",

          preview_url:
            photo.watermark_url ||
            photo.preview_url ||
            "",

          price,

          line_user_id:
            profile.userId
        }
      );

      localStorage.setItem(
        cartKey,
        JSON.stringify([...map.values()])
      );

      Swal.fire({
        icon: "success",
        title: t().addSuccess,
        showCancelButton: true,
        confirmButtonText: t().goCartConfirm,
        cancelButtonText: t().continueSelect
      }).then(result => {

        if (result.isConfirmed) {
          goCart();
        }
      });
    }

    function goEvent() {

      window.location.href =
        `event.html?event=${encodeURIComponent(eventId)}`;
    }

    function goCart() {

      window.location.href =
        `cart.html?event=${encodeURIComponent(eventId)}`;
    }

    function formatMoney(value) {

      return Number(value || 0)
        .toLocaleString(
          "th-TH",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );
    }

    function toggleDarkMode() {

      const html =
        document.documentElement;

      html.classList.toggle("dark");

      const isDark =
        html.classList.contains("dark");

      localStorage.setItem(
        "darkMode",
        isDark ? "1" : "0"
      );

      updateDarkButton();
    }

    function updateDarkButton() {

      const btn =
        document.getElementById("darkBtn");

      if (!btn) return;

      const isDark =
        document.documentElement
          .classList
          .contains("dark");

      btn.innerHTML =
        isDark
          ? "☀️ Light"
          : "🌙 Dark";
    }

    function initDarkMode() {

      const saved =
        localStorage.getItem("darkMode");

      if (saved === "1") {

        document.documentElement
          .classList.add("dark");
      }

      updateDarkButton();
    }

    function escapeHtml(text) {

      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

  </script>

  <!-- ห้ามคลิกขวา -->
  <script>
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>

  <!-- ห้ามกดค้างบันทึกภาพบนมือถือ -->
  <style>
    img {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>

  <!-- ปิดการลากรูป -->
  <script>
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
    });
  </script>

  <!-- ปิดปุ่มลัดบางอย่าง -->
  <script>
    document.addEventListener('keydown', function(e) {

      if (e.key === "F12") {
        e.preventDefault();
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
        e.preventDefault();
      }

      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
      }

    });
  </script>

</body>
</html>
