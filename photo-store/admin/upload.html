<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Upload Photos</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 min-h-screen">

  <header class="bg-black text-white p-5">
    <h1 class="text-2xl font-bold">PHOTO UPLOAD</h1>
  </header>

  <main class="max-w-3xl mx-auto p-4">

    <div class="bg-white rounded-2xl p-5 shadow">

      <div class="mb-4">
        <label class="font-semibold block mb-2">
          เลือก Event
        </label>

        <select
          id="eventSelect"
          class="w-full border rounded-xl p-3"
        ></select>
      </div>

      <div class="mb-4">

        <label class="font-semibold block mb-2">
          ราคา
        </label>

        <input
          type="number"
          id="price"
          value="100"
          class="w-full border rounded-xl p-3"
        />

      </div>

      <div
        class="border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center bg-slate-50"
      >

        <input
          type="file"
          id="fileInput"
          multiple
          accept="image/*"
          class="hidden"
        />

        <button
          onclick="document.getElementById('fileInput').click()"
          class="bg-black text-white px-6 py-3 rounded-xl font-semibold"
        >
          เลือกรูปภาพ
        </button>

        <p class="text-sm text-slate-500 mt-3">
          รองรับหลายไฟล์
        </p>

      </div>

      <div
        id="uploadStatus"
        class="mt-5 space-y-2"
      ></div>

    </div>

  </main>

  <script src="../js/config.js"></script>

  <script>

    const fileInput = document.getElementById("fileInput");
    const eventSelect = document.getElementById("eventSelect");
    const uploadStatus = document.getElementById("uploadStatus");

    async function loadEvents() {

      const { data, error } = await supabaseClient
        .from("events")
        .select("*")
        .eq("status", "published")
        .order("event_date", { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      eventSelect.innerHTML = data.map(event => `
        <option value="${event.id}">
          ${event.title}
        </option>
      `).join("");
    }

    async function uploadFile(file) {

      const eventId = eventSelect.value;
      const price = document.getElementById("price").value;

      const fileName = `${Date.now()}-${file.name}`;

      const statusDiv = document.createElement("div");

      statusDiv.className =
        "bg-slate-100 rounded-xl p-3 text-sm";

      statusDiv.innerHTML = `
        กำลังอัปโหลด: ${file.name}
      `;

      uploadStatus.prepend(statusDiv);

      // Upload ไป Supabase Storage
      const { error: uploadError } = await supabaseClient
        .storage
        .from("previews")
        .upload(fileName, file);

      if (uploadError) {

        statusDiv.innerHTML = `
          ❌ ${file.name} : ${uploadError.message}
        `;

        statusDiv.className =
          "bg-red-100 text-red-700 rounded-xl p-3 text-sm";

        return;
      }

      // Public URL
      const {
        data: publicUrlData
      } = supabaseClient
        .storage
        .from("previews")
        .getPublicUrl(fileName);

      const publicUrl = publicUrlData.publicUrl;

      // Insert DB
      const { error: insertError } = await supabaseClient
        .from("photos")
        .insert({
          event_id: eventId,
          original_path: fileName,
          preview_path: fileName,
          watermark_path: fileName,
          preview_url: publicUrl,
          watermark_url: publicUrl,
          filename: file.name,
          price: price,
          status: "active"
        });

      if (insertError) {

        statusDiv.innerHTML = `
          ❌ ${file.name} : ${insertError.message}
        `;

        statusDiv.className =
          "bg-red-100 text-red-700 rounded-xl p-3 text-sm";

        return;
      }

      statusDiv.innerHTML = `
        ✅ อัปโหลดสำเร็จ: ${file.name}
      `;

      statusDiv.className =
        "bg-green-100 text-green-700 rounded-xl p-3 text-sm";
    }

    fileInput.addEventListener("change", async (e) => {

      const files = [...e.target.files];

      for (const file of files) {
        await uploadFile(file);
      }
    });

    loadEvents();

  </script>

</body>
</html>
