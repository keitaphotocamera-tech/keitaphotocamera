<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สร้าง Event | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

  <header class="bg-slate-950 text-white px-4 py-4 shadow">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold">Admin Event</h1>
        <p class="text-sm text-slate-300">สร้างงานสำหรับระบบขายภาพผ่าน LINE</p>
      </div>
      <a href="admin-events.html" class="text-sm bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl">รายการ Event</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 grid lg:grid-cols-3 gap-5">

    <section class="lg:col-span-2 bg-white rounded-3xl shadow p-5">
      <h2 class="text-lg font-bold mb-4">สร้าง Event ใหม่</h2>

      <form id="eventForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">ชื่องาน / Event Name</label>
          <input id="name" type="text" required placeholder="เช่น Bang Wad Run 2026" class="w-full border rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">วันที่เริ่มงาน</label>
            <input id="start_date" type="date" required class="w-full border rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">วันที่สิ้นสุดงาน</label>
            <input id="end_date" type="date" required class="w-full border rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">ราคาต่อภาพ</label>
            <input id="price_per_photo" type="number" min="0" step="1" value="200" required class="w-full border rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">เบอร์ PromptPay</label>
            <input id="promptpay_id" type="text" placeholder="เช่น 0936494961" class="w-full border rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">รายละเอียดงาน</label>
          <textarea id="description" rows="4" placeholder="รายละเอียดงาน เส้นทาง ช่องทางติดต่อ หรือเงื่อนไขการซื้อภาพ" class="w-full border rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">รูปปก Event</label>
          <input id="cover" type="file" accept="image/*" class="w-full border rounded-2xl px-4 py-3 bg-white">
          <p class="text-xs text-slate-500 mt-1">แนะนำขนาด 1200 x 630 px หรือภาพแนวนอน</p>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">สถานะ Event</label>
            <select id="status" class="w-full border rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
              <option value="active">เปิดขาย / Active</option>
              <option value="draft">แบบร่าง / Draft</option>
              <option value="closed">ปิดงาน / Closed</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Slug URL</label>
            <input id="slug" type="text" placeholder="สร้างอัตโนมัติได้" class="w-full border rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
          </div>
        </div>

        <button id="saveBtn" type="submit" class="w-full bg-slate-950 hover:bg-slate-800 text-white font-semibold py-3 rounded-2xl shadow">
          สร้าง Event
        </button>
      </form>
    </section>

    <aside class="bg-white rounded-3xl shadow p-5 h-fit">
      <h3 class="font-bold mb-3">ตัวอย่าง Event</h3>
      <div class="rounded-3xl overflow-hidden border bg-slate-50">
        <img id="previewImg" src="https://placehold.co/800x450/e2e8f0/334155?text=Event+Cover" class="w-full h-44 object-cover" alt="preview">
        <div class="p-4 space-y-2">
          <h4 id="previewName" class="font-bold text-lg">ชื่อ Event</h4>
          <p id="previewDate" class="text-sm text-slate-500">วันที่จัดงาน</p>
          <p id="previewPrice" class="text-sm font-semibold">ราคา 200 บาท / ภาพ</p>
          <span id="previewStatus" class="inline-flex text-xs px-3 py-1 rounded-full bg-green-100 text-green-700">active</span>
        </div>
      </div>

      <div id="resultBox" class="hidden mt-4 p-4 rounded-2xl bg-green-50 border border-green-200 text-green-700 text-sm"></div>
    </aside>

  </main>

  <script>
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const BUCKET_NAME = "event-covers";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("eventForm");
    const saveBtn = document.getElementById("saveBtn");
    const resultBox = document.getElementById("resultBox");

    const nameInput = document.getElementById("name");
    const startDateInput = document.getElementById("start_date");
    const endDateInput = document.getElementById("end_date");
    const priceInput = document.getElementById("price_per_photo");
    const promptpayInput = document.getElementById("promptpay_id");
    const descInput = document.getElementById("description");
    const statusInput = document.getElementById("status");
    const slugInput = document.getElementById("slug");
    const coverInput = document.getElementById("cover");

    const previewImg = document.getElementById("previewImg");
    const previewName = document.getElementById("previewName");
    const previewDate = document.getElementById("previewDate");
    const previewPrice = document.getElementById("previewPrice");
    const previewStatus = document.getElementById("previewStatus");

    function makeSlug(text) {
      return text
        .toString()
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9\u0E00-\u0E7F-]/g, "")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function updatePreview() {
      previewName.textContent = nameInput.value || "ชื่อ Event";
      previewDate.textContent = `${startDateInput.value || "วันที่เริ่ม"} - ${endDateInput.value || "วันที่สิ้นสุด"}`;
      previewPrice.textContent = `ราคา ${priceInput.value || 0} บาท / ภาพ`;
      previewStatus.textContent = statusInput.value;
    }

    [nameInput, startDateInput, endDateInput, priceInput, statusInput].forEach(el => {
      el.addEventListener("input", updatePreview);
    });

    nameInput.addEventListener("input", () => {
      if (!slugInput.value) slugInput.value = makeSlug(nameInput.value);
    });

    coverInput.addEventListener("change", () => {
      const file = coverInput.files[0];
      if (file) previewImg.src = URL.createObjectURL(file);
    });

    async function uploadCover(file, eventId) {
      if (!file) return null;

      const ext = file.name.split(".").pop();
      const filePath = `${eventId}/cover-${Date.now()}.${ext}`;

      const { error: uploadError } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: true
        });

      if (uploadError) throw uploadError;

      const { data } = supabaseClient.storage
        .from(BUCKET_NAME)
        .getPublicUrl(filePath);

      return data.publicUrl;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = "กำลังสร้าง Event...";
      resultBox.classList.add("hidden");

      try {
        const eventId = crypto.randomUUID();
        const coverFile = coverInput.files[0] || null;
        const coverUrl = await uploadCover(coverFile, eventId);

        const payload = {
          id: eventId,
          name: nameInput.value.trim(),
          slug: slugInput.value.trim() || makeSlug(nameInput.value),
          description: descInput.value.trim(),
          start_date: startDateInput.value,
          end_date: endDateInput.value,
          price_per_photo: Number(priceInput.value || 0),
          promptpay_id: promptpayInput.value.trim(),
          cover_url: coverUrl,
          status: statusInput.value,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        };

        const { data, error } = await supabaseClient
          .from("events")
          .insert(payload)
          .select()
          .single();

        if (error) throw error;

        const eventUrl = `event.html?event=${data.id}`;
        resultBox.innerHTML = `✅ สร้าง Event สำเร็จ<br><br>
          <b>ลิงก์สำหรับลูกค้า:</b><br>
          <a class="underline break-all" href="${eventUrl}" target="_blank">${eventUrl}</a>`;
        resultBox.classList.remove("hidden");

        form.reset();
        previewImg.src = "https://placehold.co/800x450/e2e8f0/334155?text=Event+Cover";
        updatePreview();

      } catch (err) {
        alert("สร้าง Event ไม่สำเร็จ: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "สร้าง Event";
      }
    });

    updatePreview();
  </script>
</body>
</html>
