# create-event.html

```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สร้าง Event</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js"></script>
</head>

<body class="bg-slate-100 text-slate-800">

  <main class="max-w-3xl mx-auto p-4 pb-20">

    <header class="bg-white rounded-3xl p-5 shadow-sm mb-4">
      <p class="text-xs text-slate-500">Admin Dashboard</p>

      <h1 class="text-3xl font-bold mt-1">
        สร้าง Event
      </h1>

      <p class="text-sm text-slate-500 mt-2">
        สำหรับระบบขายภาพผ่าน LINE LIFF + Supabase
      </p>
    </header>

    <section class="bg-white rounded-3xl p-5 shadow-sm">

      <div class="space-y-5">

        <div>
          <label class="font-bold block mb-2">
            ชื่องาน Event
          </label>

          <input
            id="eventName"
            type="text"
            placeholder="เช่น Bangwad Charity Run 2026"
            class="w-full bg-slate-50 rounded-2xl p-4 outline-none"
          />
        </div>

        <div>
          <label class="font-bold block mb-2">
            รายละเอียด
          </label>

          <textarea
            id="eventDescription"
            rows="4"
            placeholder="รายละเอียดงาน"
            class="w-full bg-slate-50 rounded-2xl p-4 outline-none resize-none"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div>
            <label class="font-bold block mb-2">
              วันที่จัดงาน
            </label>

            <input
              id="eventDate"
              type="date"
              class="w-full bg-slate-50 rounded-2xl p-4 outline-none"
            />
          </div>

          <div>
            <label class="font-bold block mb-2">
              ราคาภาพเริ่มต้น
            </label>

            <input
              id="photoPrice"
              type="number"
              value="50"
              class="w-full bg-slate-50 rounded-2xl p-4 outline-none"
            />
          </div>

        </div>

        <div>
          <label class="font-bold block mb-2">
            Upload Cover Event
          </label>

          <input
            id="coverInput"
            type="file"
            accept="image/*"
            class="w-full bg-slate-50 rounded-2xl p-4"
          />

          <img
            id="coverPreview"
            class="hidden mt-4 rounded-2xl w-full max-h-[420px] object-cover"
          />
        </div>

        <div>
          <label class="font-bold block mb-2">
            สถานะ Event
          </label>

          <select
            id="eventStatus"
            class="w-full bg-slate-50 rounded-2xl p-4 outline-none"
          >
            <option value="draft">Draft</option>
            <option value="active">Active</option>
            <option value="closed">Closed</option>
          </select>
        </div>

        <button
          onclick="createEvent()"
          id="createBtn"
          class="w-full bg-slate-900 text-white rounded-2xl py-4 font-bold text-lg"
        >
          สร้าง Event
        </button>

      </div>

    </section>

    <section class="mt-6 bg-white rounded-3xl p-5 shadow-sm">

      <div class="flex items-center justify-between mb-4">

        <div>
          <p class="text-xs text-slate-500">รายการ Event</p>
          <h2 class="text-xl font-bold">Events</h2>
        </div>

        <button
          onclick="loadEvents()"
          class="bg-slate-900 text-white rounded-2xl px-4 py-2 font-bold"
        >
          Refresh
        </button>

      </div>

      <div id="eventList" class="space-y-3"></div>

    </section>

  </main>

  <script>

    const db = window.sb || window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY
    );

    const BUCKET_NAME = "event-covers";

    let selectedCover = null;

    document.addEventListener("DOMContentLoaded", async () => {
      setupPreview();
      await loadEvents();
    });

    function setupPreview() {
      const input = document.getElementById("coverInput");

      input.addEventListener("change", (e) => {
        const file = e.target.files[0];

        if (!file) return;

        selectedCover = file;

        const img = document.getElementById("coverPreview");

        img.src = URL.createObjectURL(file);
        img.classList.remove("hidden");
      });
    }

    async function uploadCover(file) {

      if (!file) return null;

      const ext = file.name.split(".").pop();

      const filename = `${crypto.randomUUID()}.${ext}`;

      const path = `covers/${filename}`;

      const { error: uploadError } = await db
        .storage
        .from(BUCKET_NAME)
        .upload(path, file, {
          upsert: false
        });

      if (uploadError) throw uploadError;

      const { data } = db
        .storage
        .from(BUCKET_NAME)
        .getPublicUrl(path);

      return data.publicUrl;
    }

    async function createEvent() {

      try {

        const btn = document.getElementById("createBtn");
        btn.disabled = true;
        btn.textContent = "กำลังสร้าง...";

        const name = document.getElementById("eventName").value.trim();
        const description = document.getElementById("eventDescription").value.trim();
        const eventDate = document.getElementById("eventDate").value;
        const photoPrice = Number(document.getElementById("photoPrice").value || 0);
        const status = document.getElementById("eventStatus").value;

        if (!name) {
          throw new Error("กรุณากรอกชื่อ Event");
        }

        let coverUrl = null;

        if (selectedCover) {
          Swal.fire({
            title: "กำลังอัปโหลด Cover...",
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
          });

          coverUrl = await uploadCover(selectedCover);
        }

        Swal.fire({
          title: "กำลังสร้าง Event...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        const payload = {
          name,
          description,
          event_date: eventDate || null,
          cover_url: coverUrl,
          photo_price: photoPrice,
          status
        };

        const { data, error } = await db
          .from("events")
          .insert(payload)
          .select()
          .single();

        if (error) throw error;

        Swal.fire({
          icon: "success",
          title: "สร้าง Event สำเร็จ",
          html: `
            <div style="text-align:left">
              <p><b>Event ID:</b></p>
              <p style="word-break:break-all">${data.id}</p>

              <hr style="margin:12px 0">

              <p><b>URL Event:</b></p>
              <p style="word-break:break-all">
                event.html?event=${data.id}
              </p>
            </div>
          `
        });

        clearForm();
        await loadEvents();

      } catch (err) {

        console.error(err);

        Swal.fire(
          "เกิดข้อผิดพลาด",
          err.message || "สร้าง Event ไม่สำเร็จ",
          "error"
        );

      } finally {

        const btn = document.getElementById("createBtn");
        btn.disabled = false;
        btn.textContent = "สร้าง Event";
      }
    }

    async function loadEvents() {

      const box = document.getElementById("eventList");

      box.innerHTML = `
        <div class="text-center py-10 text-slate-400">
          กำลังโหลด...
        </div>
      `;

      const { data, error } = await db
        .from("events")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        box.innerHTML = `
          <div class="text-red-500">
            โหลด Event ไม่สำเร็จ
          </div>
        `;
        return;
      }

      if (!data?.length) {
        box.innerHTML = `
          <div class="text-center py-10 text-slate-400">
            ยังไม่มี Event
          </div>
        `;
        return;
      }

      box.innerHTML = "";

      data.forEach(event => {

        const card = document.createElement("div");

        card.className = "border border-slate-200 rounded-3xl overflow-hidden";

        card.innerHTML = `
          <div class="grid md:grid-cols-[220px_1fr]">

            <img
              src="${event.cover_url || 'https://placehold.co/800x600?text=EVENT'}"
              class="w-full h-full object-cover aspect-video bg-slate-200"
            >

            <div class="p-4">

              <div class="flex justify-between items-start gap-3">

                <div>
                  <h3 class="text-xl font-bold">
                    ${escapeHtml(event.name || '-')}
                  </h3>

                  <p class="text-sm text-slate-500 mt-1">
                    ${escapeHtml(event.description || '-')}
                  </p>
                </div>

                <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100">
                  ${event.status || '-'}
                </span>

              </div>

              <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">

                <div>
                  <p class="text-slate-400">วันที่</p>
                  <p class="font-bold">${event.event_date || '-'}</p>
                </div>

                <div>
                  <p class="text-slate-400">ราคาภาพ</p>
                  <p class="font-bold">฿${Number(event.photo_price || 0).toLocaleString()}</p>
                </div>

                <div>
                  <p class="text-slate-400">Event ID</p>
                  <p class="font-bold text-xs break-all">${event.id}</p>
                </div>

                <div>
                  <p class="text-slate-400">หน้า Event</p>
                  <a
                    href="../event.html?event=${event.id}"
                    target="_blank"
                    class="font-bold text-blue-600"
                  >
                    เปิดหน้า Event
                  </a>
                </div>

              </div>

            </div>

          </div>
        `;

        box.appendChild(card);
      });
    }

    function clearForm() {
      document.getElementById("eventName").value = "";
      document.getElementById("eventDescription").value = "";
      document.getElementById("eventDate").value = "";
      document.getElementById("photoPrice").value = "50";
      document.getElementById("eventStatus").value = "draft";
      document.getElementById("coverInput").value = "";

      const img = document.getElementById("coverPreview");
      img.src = "";
      img.classList.add("hidden");

      selectedCover = null;
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

  </script>

</body>
</html>
